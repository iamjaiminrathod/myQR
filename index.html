<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Master | jaimin.web</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    /* ================= CSS VARIABLES ================= */
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #ec4899;
    }

    /* ================= RESET & GLOBAL ================= */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      scrollbar-width: none; /* Disable scrollbar space on Windows */
    }

    body {
      background-color: #f8fafc;
      background-image: radial-gradient(circle at top right, #e0e7ff 0%, transparent 40%), 
                        radial-gradient(circle at bottom left, #fce7f3 0%, transparent 40%);
      background-attachment: fixed;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.75rem;
      -webkit-user-select: none;
      user-select: none;
    }
    @media (min-width: 640px) { body { padding: 2rem; } }

    input, textarea, select {
      -webkit-user-select: text !important;
      user-select: text !important;
      font-family: inherit;
    }

    button { 
      font-family: inherit; 
      cursor: pointer; 
      border: none; 
      background: none; 
      outline: none; 
    }
    button:focus { outline: none; }
    
    img, svg, canvas { -webkit-user-drag: none; }
    .hide { display: none !important; }

    /* ================= HEADER ================= */
    .header {
      width: 100%; max-width: 64rem; 
      display: flex; justify-content: center; align-items: center;
      margin-top: 0.5rem; margin-bottom: 1.5rem;
    }
    @media (min-width: 640px) { .header { margin-bottom: 2rem; } }

    .header-content { display: flex; align-items: center; gap: 0.75rem; }
    
    .header-icon-box {
      background: linear-gradient(to top right, var(--primary), var(--secondary));
      padding: 0.625rem; border-radius: 0.75rem; color: #ffffff;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); pointer-events: none;
    }
    .header-icon-box svg { width: 1.5rem; height: 1.5rem; }
    @media (min-width: 640px) { .header-icon-box svg { width: 1.75rem; height: 1.75rem; } }

    .header-title {
      font-family: 'Montserrat', sans-serif; font-weight: 900;
      font-size: 1.5rem; letter-spacing: -0.025em;
      background: linear-gradient(to right, #0f172a, #475569);
      -webkit-background-clip: text; color: transparent;
    }
    @media (min-width: 640px) { .header-title { font-size: 1.875rem; } }

    /* ================= MAIN CONTAINER ================= */
    .glass-card {
      width: 100%; max-width: 64rem;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid #ffffff; border-radius: 2rem;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
      padding: 1rem; display: flex; flex-direction: column; position: relative;
    }
    @media (min-width: 640px) { .glass-card { padding: 2rem; } }

    /* ================= TABS ================= */
    .tabs-container {
      position: relative; display: flex; width: 100%; max-width: 24rem;
      margin: 0 auto 2rem; padding: 0.25rem; border-radius: 0.75rem;
      background-color: rgba(241, 245, 249, 0.5);
      border: 1px solid rgba(226, 232, 240, 0.5);
    }
    .tab-btn {
      flex: 1; text-align: center; padding: 0.625rem 0;
      display: flex; justify-content: center; align-items: center; gap: 0.5rem;
      font-size: 0.875rem; font-weight: 600; color: #64748b;
      position: relative; z-index: 10; transition: color 0.3s;
    }
    .tab-btn:hover { color: #334155; }
    .tab-btn.active { color: var(--primary); }
    .tab-btn svg { width: 1rem; height: 1rem; }
    
    .tab-indicator {
      position: absolute; top: 0.25rem; bottom: 0.25rem; left: 0.25rem;
      background-color: #ffffff; border-radius: 0.5rem;
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); border: 1px solid #f1f5f9;
      z-index: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ================= LAYOUT GRID ================= */
    .content-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
    
    .col-left { display: flex; flex-direction: column; gap: 1.5rem; }
    .col-right { display: flex; flex-direction: column; align-items: center; }

    @media (min-width: 640px) { .content-grid { gap: 2.5rem; } }
    @media (min-width: 1024px) {
      .content-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
      .col-left { grid-column: span 7 / span 7; }
      .col-right { grid-column: span 5 / span 5; }
    }

    /* ================= CATEGORY BUTTONS ================= */
    .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; padding: 0 0.25rem; }
    .category-label { display: block; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .view-toggle {
      color: #64748b; background: #ffffff; border: 1px solid #e2e8f0;
      padding: 0.375rem 0.625rem; border-radius: 0.5rem; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
      display: flex; align-items: center; gap: 0.375rem;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.025em;
      transition: color 0.2s;
    }
    .view-toggle:hover { color: var(--primary); }
    .view-toggle svg { width: 0.875rem; height: 0.875rem; }

    .type-btn {
      background-color: #ffffff; color: #475569; border: 1px solid #e2e8f0;
      padding: 0.625rem; border-radius: 0.75rem;
      font-size: 10px; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem;
      
      /* FIX: Transition is only on colors/shadows. NO 'width' or 'all' to stop shrink/grow bug */
      transition: background-color 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    @media (min-width: 640px) { .type-btn { font-size: 0.75rem; } }
    .type-btn:hover { background-color: #f8fafc; }
    .type-btn.active {
      background-color: var(--primary); color: #ffffff; border-color: transparent;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2), 0 2px 4px -2px rgba(79, 70, 229, 0.2);
      font-weight: 600;
    }
    .type-btn svg { width: 1.25rem; height: 1.25rem; pointer-events: none; }
    .type-btn.active svg { color: #ffffff !important; }

    .view-scroll {
      display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; scroll-behavior: smooth; gap: 0.625rem;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .view-scroll::-webkit-scrollbar { display: none; }
    .view-scroll .type-btn { flex: 0 0 auto; width: 76px; scroll-snap-align: start; }
    @media (min-width: 640px) { .view-scroll .type-btn { width: 86px; } }

    .view-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.625rem;
      max-height: 220px; overflow-y: auto; -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth; padding-bottom: 1.5rem;
    }
    @media (min-width: 640px) { .view-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (min-width: 768px) { .view-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .view-grid .type-btn { width: 100%; }
    
    .view-grid::-webkit-scrollbar { width: 4px; }
    .view-grid::-webkit-scrollbar-track { background: transparent; }
    .view-grid::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 10px; }

    .fade-overlay {
      position: absolute; bottom: 0; left: 0; right: 0; height: 2.5rem;
      background: linear-gradient(to top, #ffffff, transparent);
      pointer-events: none; transition: opacity 0.3s;
    }

    .scroll-hint { display: flex; align-items: center; justify-content: center; margin-top: 0.75rem; transition: opacity 0.3s; }
    .scroll-hint-inner {
      display: flex; align-items: center; gap: 0.625rem; padding: 0.375rem 1rem;
      background-color: #ffffff; border: 1px solid #e2e8f0;
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); border-radius: 9999px;
    }
    .scroll-hint-inner svg { width: 0.875rem; height: 0.875rem; color: var(--primary); animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .scroll-hint-inner span { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.15em; color: #64748b; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

    /* ================= PREMIUM CARDS & INPUTS ================= */
    .premium-card {
      background-color: #ffffff; padding: 1.25rem; border-radius: 1rem;
      border: 1px solid #f1f5f9; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03), 0 0 3px rgba(0,0,0,0.02);
      position: relative;
    }
    @media (min-width: 640px) { .premium-card { padding: 1.5rem; } }

    .card-title-small {
      display: flex; align-items: center; gap: 0.5rem; font-size: 11px;
      font-weight: 700; color: #334155; margin-bottom: 1rem;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .card-title-small span { width: 0.375rem; height: 0.375rem; border-radius: 9999px; background-color: var(--primary); }

    .inputs-wrapper { display: flex; flex-direction: column; gap: 0.875rem; }
    .input-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }

    .custom-input {
      width: 100%; padding: 0.875rem 1rem;
      border-radius: 0.75rem; border: 1px solid #e2e8f0;
      background-color: rgba(248, 250, 252, 0.5); color: #1e293b;
      font-size: 0.875rem; font-weight: 500; outline: none; transition: all 0.2s;
    }
    @media (min-width: 640px) {
      .custom-input { padding: 0.75rem 1rem; font-size: 1rem; }
    }
    .custom-input::placeholder { color: #94a3b8; }
    .custom-input:hover { border-color: #cbd5e1; }
    .custom-input:focus { background-color: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }

    .error-box {
      background-color: #fff1f2; color: #e11d48; border: 1px solid #ffe4e6;
      padding: 0.625rem 0.75rem; border-radius: 0.75rem; font-size: 0.75rem;
      font-weight: 700; margin-top: 1rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .error-box svg { width: 1rem; height: 1rem; }

    /* ================= DESIGN CUSTOMIZATION ================= */
    .card-title-icon {
      font-size: 0.875rem; font-weight: 600; margin-bottom: 1.25rem;
      color: #1e293b; display: flex; align-items: center; gap: 0.5rem;
    }
    .icon-wrap { padding: 0.375rem; background-color: #eef2ff; border-radius: 0.5rem; color: var(--primary); }
    .icon-wrap svg { width: 1rem; height: 1rem; }

    .design-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    @media (min-width: 640px) { .design-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    
    .design-label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 0.375rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.025em; }
    
    .color-picker {
      border: 1px solid #e2e8f0; border-radius: 0.75rem; overflow: hidden;
      height: 2.5rem; padding: 0.125rem; background-color: #ffffff; cursor: pointer;
    }
    .color-picker input { width: 100%; height: 100%; cursor: pointer; border: none; padding: 0; background-color: transparent; border-radius: 0.5rem; outline: none; }

    .logo-section { display: flex; align-items: center; gap: 0.75rem; }
    .btn-upload {
      background-color: #f8fafc; border: 1px dashed #cbd5e1; color: #475569;
      padding: 0.625rem 1rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s;
    }
    .btn-upload:hover { border-color: var(--primary); background-color: #eef2ff; }
    .btn-upload svg { width: 1rem; height: 1rem; color: var(--primary); }
    
    .btn-remove {
      display: flex; align-items: center; gap: 0.375rem; color: #f43f5e;
      background-color: #fff1f2; border: 1px solid #ffe4e6;
      padding: 0.625rem 1rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 600;
    }
    .btn-remove svg { width: 0.875rem; height: 0.875rem; }

    /* ================= LIVE PREVIEW ================= */
    .preview-card { overflow: hidden; border-radius: 1.5rem; padding: 1.25rem; display: flex; flex-direction: column; align-items: center; width: 100%; }
    @media (min-width: 640px) { .preview-card { padding: 2rem; } }
    
    .preview-top-line { position: absolute; top: 0; left: 0; width: 100%; height: 0.25rem; background: linear-gradient(to right, var(--primary), var(--secondary)); opacity: 0.8; }
    
    .preview-title {
      font-size: 0.75rem; font-weight: 700; color: #94a3b8; margin-bottom: 2rem;
      text-transform: uppercase; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.5rem;
    }
    .status-dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; }
    .status-dot.active { background-color: #34d399; animation: pulse 2s infinite; }
    .status-dot.inactive { background-color: #cbd5e1; }

    .qr-container {
      background-color: #ffffff; padding: 0.75rem; border-radius: 1rem;
      box-shadow: 0 15px 40px -10px rgba(0,0,0,0.1); margin-bottom: 2.5rem;
      width: 200px; height: 200px; display: flex; align-items: center; justify-content: center;
      border: 1px solid #f8fafc; transition: all 0.5s;
    }
    @media (min-width: 640px) { .qr-container { width: 240px; height: 240px; } }
    .qr-container.disabled { opacity: 0.3; filter: grayscale(100%) blur(2px); }
    #qr-preview-wrapper canvas, #qr-preview-wrapper svg { pointer-events: none; }

    .dl-controls { width: 100%; max-width: 280px; display: flex; flex-direction: column; gap: 1.25rem; }
    
    .format-wrap { display: flex; gap: 0.5rem; background-color: #f8fafc; padding: 0.375rem; border-radius: 0.75rem; border: 1px solid #f1f5f9; }
    .format-btn {
      flex: 1; padding: 0.625rem; border-radius: 0.5rem; font-size: 0.875rem;
      display: flex; justify-content: center; align-items: center; gap: 0.375rem; transition: background-color 0.2s, color 0.2s, box-shadow 0.2s; /* FIX: Fixed Size jumping */
    }
    .format-btn.active { background-color: #ffffff; color: var(--primary); font-weight: 700; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .format-btn.inactive { background-color: transparent; color: #64748b; font-weight: 600; border: 1px solid transparent;}
    .format-btn.inactive:hover { color: #334155; }

    .btn-download {
      width: 100%; margin-top: 0.75rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem;
      background-color: var(--primary); color: #ffffff; padding: 1rem; border-radius: 0.75rem;
      font-size: 0.875rem; font-weight: 700; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3); transition: all 0.2s;
    }
    .btn-download:hover:not(.disabled) { background-color: var(--primary-hover); }
    .btn-download.disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-download svg { width: 1rem; height: 1rem; }

    /* ================= SCANNER SECTION ================= */
    .scanner-section { display: flex; flex-direction: column; align-items: center; padding: 1.5rem 0; width: 100%; max-width: 32rem; margin: 0 auto; position: relative; z-index: 10; }
    
    .alert-msg {
      width: 100%; margin-bottom: 1.25rem; padding: 1rem 1.25rem; border-radius: 0.75rem;
      font-size: 0.875rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem;
      box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
    }
    .alert-msg.error { background-color: #fff1f2; color: #e11d48; border: 1px solid #ffe4e6; }
    .alert-msg.success { background-color: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .alert-msg svg { flex-shrink: 0; width: 1.25rem; height: 1.25rem; }

    .scanner-box { width: 100%; background-color: #ffffff; padding: 0.625rem; border-radius: 2rem; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
    
    #reader {
      width: 100%; min-height: 320px; background-color: rgba(241, 245, 249, 0.8);
      border-radius: 1.5rem; overflow: hidden; position: relative;
      border: 1px solid rgba(226, 232, 240, 0.5); display: flex; justify-content: center; align-items: center; color: #94a3b8;
    }
    #reader video { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; object-fit: cover !important; border-radius: 1.5rem; }
    #reader canvas { display: none !important; }
    #reader__scan_region { background: transparent; z-index: 10; width: 100%; height: 100%; }
    #reader__dashboard_section_csr span, #reader__dashboard_section_swaplink { display: none !important; }

    .cam-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 320px; gap: 1rem; z-index: 20; position: relative; }
    .cam-icon { padding: 1rem; background-color: #ffffff; border-radius: 9999px; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
    .cam-icon svg { width: 2rem; height: 2rem; color: #cbd5e1; }
    .cam-text { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; }

    .cam-controls { display: flex; justify-content: center; gap: 0.75rem; margin-top: 1.25rem; padding: 0 0.75rem 0.75rem; }
    
    .btn-cam-start { width: 100%; background-color: var(--primary); color: #ffffff; padding: 0.875rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 0.5rem; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2); transition: background-color 0.2s; }
    .btn-cam-start:hover { background-color: #4338ca; }
    .btn-cam-start svg { width: 1.25rem; height: 1.25rem; }
    
    .btn-cam-stop { width: 100%; background-color: #1e293b; color: #ffffff; padding: 0.875rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: background-color 0.2s; }
    .btn-cam-stop:hover { background-color: #0f172a; }
    .btn-cam-stop svg { width: 1rem; height: 1rem; fill: currentColor; }

    /* ================= SCAN RESULT ================= */
    .scan-result-box { margin-top: 2rem; width: 100%; padding: 1.25rem; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03); transition: all 0.3s; }
    
    .res-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 0.75rem; }
    .res-title { font-size: 0.875rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; letter-spacing: 0.025em; }
    .res-title svg { width: 1.25rem; height: 1.25rem; }
    
    .btn-copy { padding: 0.5rem; background-color: #f8fafc; border-radius: 0.5rem; color: #64748b; border: 1px solid #e2e8f0; transition: all 0.2s; }
    .btn-copy:hover { color: var(--primary); background-color: #eef2ff; }
    .btn-copy svg { width: 1rem; height: 1rem; }
    .btn-copy.success { color: var(--primary); }

    .res-content { font-size: 0.875rem; color: #475569; user-select: text; }

    /* JS Injected Result UI */
    .app-res-box { padding: 1rem; border-radius: 0.75rem; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.75rem; border: 1px solid; }
    .app-res-box span { font-size: 0.875rem; font-weight: 700; color: #334155; word-break: break-all; }
    .app-res-btn { width: 100%; padding: 0.75rem 1.25rem; color: #ffffff; font-size: 0.875rem; font-weight: 700; border-radius: 0.75rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 0.25rem; box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05); text-decoration: none; transition: all 0.2s; outline: none; -webkit-tap-highlight-color: transparent;}
    .app-res-btn svg { width: 1rem; height: 1rem; }

    .t-upi { background-color: #eef2ff; border-color: #e0e7ff; }
    .t-upi .l { color: #64748b; font-weight: 600; font-size: 0.875rem; margin-bottom: -0.25rem;}
    .t-upi .v { font-weight: 900; font-size: 1.125rem; color: #1e293b; }
    .t-upi .s { font-size: 0.75rem; color: #64748b; font-weight: 500; word-break: break-all; }
    .t-upi .a { font-weight: 700; font-size: 1.25rem; color: #059669; margin-top: 0.5rem; }
    .b-upi { background-color: #1ea271; } .b-upi:hover { background-color: #16855b; }

    .t-wa { background-color: rgba(37,211,102,0.1); border-color: rgba(37,211,102,0.3); }
    .t-wa svg { color: #25D366; width: 2rem; height: 2rem; }
    .b-wa { background-color: #25D366; } .b-wa:hover { background-color: #128C7E; }

    .t-map { background-color: #eff6ff; border-color: #dbeafe; }
    .t-map svg { color: #3b82f6; width: 2rem; height: 2rem; }

  <script>
    lucide.createIcons();

    // ================= Tabs Logic =================
    const tabs = { gen: document.getElementById('tab-generator'), scan: document.getElementById('tab-scanner') };
    const sections = { gen: document.getElementById('section-generator'), scan: document.getElementById('section-scanner') };
    const indicator = document.getElementById('tab-indicator');

    const updateIndicator = (activeTab) => { 
        indicator.style.width = `${activeTab.offsetWidth}px`; 
        indicator.style.left = `${activeTab.offsetLeft}px`; 
    };
    window.addEventListener('load', () => updateIndicator(tabs.gen));
    window.addEventListener('resize', () => { updateIndicator(!sections.scan.classList.contains('hide') ? tabs.scan : tabs.gen); });

    const switchTab = (tabName) => {
      Object.values(sections).forEach(sec => sec.classList.add('hide'));
      Object.values(tabs).forEach(tab => tab.classList.remove('active'));
      sections[tabName].classList.remove('hide');
      tabs[tabName].classList.add('active');
      updateIndicator(tabs[tabName]);
      if (tabName !== 'scan') stopScanner();
    };

    tabs.gen.addEventListener('click', () => switchTab('gen'));
    tabs.scan.addEventListener('click', () => switchTab('scan'));

    // ================= View Toggle Logic (Grid/Scroll) =================
    let isGridView = true; 
    const typeButtonsContainer = document.getElementById('type-buttons');
    const toggleViewBtn = document.getElementById('toggle-view-btn');
    const viewIcon = document.getElementById('view-icon');
    const viewText = document.getElementById('view-text');
    const scrollHint = document.getElementById('scroll-hint');
    const gridFade = document.getElementById('grid-fade');

    toggleViewBtn.addEventListener('click', () => {
      isGridView = !isGridView;
      if (isGridView) {
        typeButtonsContainer.classList.replace('view-scroll', 'view-grid');
        viewIcon.setAttribute('data-lucide', 'list');
        viewText.textContent = 'Scroll';
        scrollHint.classList.add('hide');
        gridFade.classList.remove('hide');
      } else {
        typeButtonsContainer.classList.replace('view-grid', 'view-scroll');
        viewIcon.setAttribute('data-lucide', 'layout-grid');
        viewText.textContent = 'Grid';
        scrollHint.classList.remove('hide');
        gridFade.classList.add('hide');
      }
      lucide.createIcons();
    });

    // ================= Generator Logic =================
    const PREVIEW_SIZE = 220; 
    const qrOptions = { width: PREVIEW_SIZE, height: PREVIEW_SIZE, data: "https://qrmaster.com", margin: 5, imageOptions: { hideBackgroundDots: true, imageSize: 0.4, margin: 5 }, dotsOptions: { color: "#0f172a", type: "rounded" }, backgroundOptions: { color: "#ffffff" }, cornersSquareOptions: { color: "#0f172a", type: "extra-rounded" }, cornersDotOptions: { color: "#0f172a", type: "dot" } };
    const qrCode = new QRCodeStyling(qrOptions);
    qrCode.append(document.getElementById("qr-preview-wrapper"));

    const inputTemplates = {
      url: `<input type="url" id="val-url" placeholder="Website URL" class="custom-input" maxlength="2048">`,
      text: `<textarea id="val-text" placeholder="Enter your text..." class="custom-input" rows="3" maxlength="500"></textarea>`,
      email: `<div class="inputs-wrapper"><input type="email" id="val-email" placeholder="Email Address" class="custom-input" maxlength="255"><input type="text" id="val-sub" placeholder="Subject" class="custom-input" maxlength="100"><textarea id="val-body" placeholder="Message" class="custom-input" rows="2" maxlength="500"></textarea></div>`,
      sms: `<div class="inputs-wrapper"><input type="tel" id="val-phone" placeholder="Phone Number" class="custom-input" maxlength="15"><textarea id="val-sms-body" placeholder="Message" class="custom-input" rows="2" maxlength="160"></textarea></div>`,
      wifi: `<div class="inputs-wrapper"><input type="text" id="val-ssid" placeholder="Network Name" class="custom-input" maxlength="32"><input type="password" id="val-pw" placeholder="Password" class="custom-input" maxlength="63"><select id="val-enc" class="custom-input"><option value="WPA">WPA / WPA2</option><option value="WEP">WEP</option><option value="nopass">No Encryption</option></select></div>`,
      vcard: `<div class="inputs-wrapper"><div class="input-grid-2"><input type="text" id="val-fname" placeholder="First Name" class="custom-input" maxlength="50"><input type="text" id="val-lname" placeholder="Last Name" class="custom-input" maxlength="50"></div><input type="tel" id="val-vc-phone" placeholder="Mobile" class="custom-input" maxlength="15"><input type="email" id="val-vc-email" placeholder="Email (Optional)" class="custom-input" maxlength="255"><input type="text" id="val-org" placeholder="Company" class="custom-input" maxlength="100"></div>`,
      phone: `<input type="tel" id="val-call" placeholder="Phone Number" class="custom-input" maxlength="15">`,
      whatsapp: `<div class="inputs-wrapper"><input type="tel" id="val-wa-phone" placeholder="WhatsApp Number" class="custom-input" maxlength="15"><textarea id="val-wa-msg" placeholder="Message (Optional)" class="custom-input" rows="2"></textarea></div>`,
      upi: `<div class="inputs-wrapper"><input type="text" id="val-upi-id" placeholder="UPI ID (e.g. name@bank)" class="custom-input"><input type="text" id="val-upi-name" placeholder="Payee Name" class="custom-input"><input type="number" id="val-upi-amt" placeholder="Amount (Optional)" class="custom-input"></div>`,
      map: `<input type="text" id="val-map" placeholder="Location Name or Maps Link" class="custom-input">`,
      youtube: `<input type="url" id="val-yt" placeholder="YouTube URL" class="custom-input">`,
      instagram: `<input type="text" id="val-ig" placeholder="Instagram Username" class="custom-input">`,
      facebook: `<input type="url" id="val-fb" placeholder="Facebook URL" class="custom-input">`,
      linkedin: `<input type="url" id="val-li" placeholder="LinkedIn URL" class="custom-input">`,
      telegram: `<input type="text" id="val-tg" placeholder="Telegram Username" class="custom-input">`,
      app: `<input type="url" id="val-app" placeholder="App Store / Play Store Link" class="custom-input">`
    };

    let currentType = 'url';
    const dynamicInputs = document.getElementById('dynamic-inputs');
    const errorMsgBox = document.getElementById('input-error-msg');
    const errorText = document.getElementById('error-msg-text');
    const dlBtn = document.getElementById('main-download-btn');
    const qrWrapper = document.getElementById('qr-preview-wrapper');
    const indicatorDot = document.getElementById('preview-indicator');

    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const targetBtn = e.target.closest('.type-btn');
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        targetBtn.classList.add('active');
        currentType = targetBtn.dataset.type;
        dynamicInputs.innerHTML = inputTemplates[currentType];
        lucide.createIcons();
        attachInputListeners();
        validateAndUpdateQR();
      });
    });

    dynamicInputs.innerHTML = inputTemplates['url'];
    lucide.createIcons();

    const validateInputs = () => {
      const getVal = (id) => document.getElementById(id)?.value.trim() || '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
      const phoneRegex = /^\+?[0-9\s\-]{7,15}$/;
      const upiRegex = /^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/;

      switch(currentType) {
        case 'url': return (!getVal('val-url')) ? {valid:false, msg:'Please enter a URL.'} : (!urlRegex.test(getVal('val-url'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'text': return getVal('val-text') ? {valid:true} : {valid:false, msg:'Please enter some text.'};
        case 'email': return (!getVal('val-email')) ? {valid:false, msg:'Please enter email.'} : (!emailRegex.test(getVal('val-email'))) ? {valid:false, msg:'Invalid email.'} : {valid:true};
        case 'sms': return (!getVal('val-phone')) ? {valid:false, msg:'Please enter phone number.'} : (!phoneRegex.test(getVal('val-phone'))) ? {valid:false, msg:'Invalid phone.'} : {valid:true};
        case 'wifi': return getVal('val-ssid') ? {valid:true} : {valid:false, msg:'Please enter Network Name.'};
        case 'vcard': 
          if (!getVal('val-fname') && !getVal('val-vc-phone')) return {valid:false, msg:'First Name or Phone required.'};
          if (getVal('val-vc-phone') && !phoneRegex.test(getVal('val-vc-phone'))) return {valid:false, msg:'Invalid phone.'};
          if (getVal('val-vc-email') && !emailRegex.test(getVal('val-vc-email'))) return {valid:false, msg:'Invalid email.'};
          return {valid:true};
        case 'phone': return (!getVal('val-call')) ? {valid:false, msg:'Please enter phone number.'} : (!phoneRegex.test(getVal('val-call'))) ? {valid:false, msg:'Invalid phone.'} : {valid:true};
        case 'whatsapp': return (!getVal('val-wa-phone')) ? {valid:false, msg:'Please enter WhatsApp number.'} : (!phoneRegex.test(getVal('val-wa-phone'))) ? {valid:false, msg:'Invalid phone.'} : {valid:true};
        case 'upi':
          if (!getVal('val-upi-id')) return {valid:false, msg:'Please enter UPI ID.'};
          if (!upiRegex.test(getVal('val-upi-id'))) return {valid:false, msg:'Invalid UPI ID (e.g. name@bank).'};
          if (!getVal('val-upi-name')) return {valid:false, msg:'Please enter Payee Name.'};
          return {valid:true};
        case 'map': return (!getVal('val-map')) ? {valid:false, msg:'Please enter Map Link or Location Name.'} : {valid:true};
        case 'youtube': return (!getVal('val-yt')) ? {valid:false, msg:'Please enter YouTube URL.'} : (!urlRegex.test(getVal('val-yt'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'facebook': return (!getVal('val-fb')) ? {valid:false, msg:'Please enter Facebook URL.'} : (!urlRegex.test(getVal('val-fb'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'linkedin': return (!getVal('val-li')) ? {valid:false, msg:'Please enter LinkedIn URL.'} : (!urlRegex.test(getVal('val-li'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'app': return (!getVal('val-app')) ? {valid:false, msg:'Please enter App Link.'} : (!urlRegex.test(getVal('val-app'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'instagram': return (!getVal('val-ig')) ? {valid:false, msg:'Please enter Instagram username.'} : (getVal('val-ig').includes(' ')) ? {valid:false, msg:'No spaces allowed.'} : {valid:true};
        case 'telegram': return (!getVal('val-tg')) ? {valid:false, msg:'Please enter Telegram username.'} : (getVal('val-tg').includes(' ')) ? {valid:false, msg:'No spaces allowed.'} : {valid:true};
      }
    };

    const getFormattedData = () => {
      const getVal = (id) => document.getElementById(id)?.value.trim() || '';
      switch(currentType) {
        case 'url': return (/^https?:\/\//i.test(getVal('val-url'))) ? getVal('val-url') : 'https://' + getVal('val-url');
        case 'text': return getVal('val-text');
        case 'email': return `mailto:${getVal('val-email')}?subject=${encodeURIComponent(getVal('val-sub'))}&body=${encodeURIComponent(getVal('val-body'))}`;
        case 'sms': return `smsto:${getVal('val-phone')}:${getVal('val-sms-body')}`;
        case 'wifi': return `WIFI:T:${getVal('val-enc')};S:${getVal('val-ssid')};P:${getVal('val-pw')};;`;
        case 'vcard': return `BEGIN:VCARD\nVERSION:3.0\nN:${getVal('val-lname')};${getVal('val-fname')}\nFN:${getVal('val-fname')} ${getVal('val-lname')}\nTEL;TYPE=CELL:${getVal('val-vc-phone')}\nEMAIL:${getVal('val-vc-email')}\nORG:${getVal('val-org')}\nEND:VCARD`;
        case 'phone': return `tel:${getVal('val-call')}`;
        case 'whatsapp': return `https://wa.me/${getVal('val-wa-phone').replace(/\+/g,'')}?text=${encodeURIComponent(getVal('val-wa-msg'))}`;
        case 'upi': return `upi://pay?pa=${getVal('val-upi-id')}&pn=${encodeURIComponent(getVal('val-upi-name'))}${getVal('val-upi-amt') ? '&am='+getVal('val-upi-amt') : ''}&cu=INR`;
        case 'map': 
          let mapVal = getVal('val-map');
          return /^https?:\/\//i.test(mapVal) ? mapVal : 'https://maps.google.com/?q=' + encodeURIComponent(mapVal);
        case 'youtube': return (/^https?:\/\//i.test(getVal('val-yt'))) ? getVal('val-yt') : 'https://' + getVal('val-yt');
        case 'facebook': return (/^https?:\/\//i.test(getVal('val-fb'))) ? getVal('val-fb') : 'https://' + getVal('val-fb');
        case 'linkedin': return (/^https?:\/\//i.test(getVal('val-li'))) ? getVal('val-li') : 'https://' + getVal('val-li');
        case 'app': return (/^https?:\/\//i.test(getVal('val-app'))) ? getVal('val-app') : 'https://' + getVal('val-app');
        case 'instagram': return `https://instagram.com/${getVal('val-ig').replace('@', '')}`;
        case 'telegram': return `https://t.me/${getVal('val-tg').replace('@', '')}`;
      }
    };

    const validateAndUpdateQR = () => {
      const validation = validateInputs();
      if(!validation.valid) {
        errorText.textContent = validation.msg; errorMsgBox.classList.remove('hide'); 
        qrWrapper.classList.add('disabled'); 
        dlBtn.classList.add('disabled');
        dlBtn.disabled = true;
        indicatorDot.className = 'status-dot inactive';
      } else {
        errorMsgBox.classList.add('hide'); 
        qrWrapper.classList.remove('disabled'); 
        dlBtn.classList.remove('disabled');
        dlBtn.disabled = false;
        indicatorDot.className = 'status-dot active';
        qrOptions.data = getFormattedData(); qrCode.update(qrOptions);
      }
    };

    const attachInputListeners = () => { 
      dynamicInputs.querySelectorAll('input, textarea, select').forEach(el => {
        if(el.type === 'tel') { el.addEventListener('keypress', (e) => { if(!/[0-9+\- ]/.test(e.key)) e.preventDefault(); }); }
        el.addEventListener('input', validateAndUpdateQR);
      }); 
    };
    attachInputListeners(); validateAndUpdateQR();

    // Design Listeners
    document.getElementById('color-dark').addEventListener('input', (e) => { qrOptions.dotsOptions.color = e.target.value; qrOptions.cornersSquareOptions.color = e.target.value; qrOptions.cornersDotOptions.color = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('color-light').addEventListener('input', (e) => { qrOptions.backgroundOptions.color = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('dots-style').addEventListener('change', (e) => { qrOptions.dotsOptions.type = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('corners-style').addEventListener('change', (e) => { qrOptions.cornersSquareOptions.type = e.target.value; qrOptions.cornersDotOptions.type = e.target.value === 'extra-rounded' ? 'dot' : 'square'; qrCode.update(qrOptions); });

    const logoInput = document.getElementById('logo-input'), clearLogoBtn = document.getElementById('clear-logo');
    logoInput.addEventListener('change', function(e) { if(e.target.files[0]) { const reader = new FileReader(); reader.onload = (ev) => { qrOptions.image = ev.target.result; qrCode.update(qrOptions); clearLogoBtn.classList.remove('hide'); }; reader.readAsDataURL(e.target.files[0]); }});
    clearLogoBtn.addEventListener('click', () => { logoInput.value = ''; qrOptions.image = null; qrCode.update(qrOptions); clearLogoBtn.classList.add('hide'); });

    // Format Setup
    let selectedFormat = 'png';
    const btnPng = document.getElementById('btn-format-png'), btnSvg = document.getElementById('btn-format-svg');
    const updateFormatUI = (format) => {
      selectedFormat = format;
      if(format === 'png') { btnPng.className = "format-btn active"; btnSvg.className = "format-btn inactive"; }
      else { btnSvg.className = "format-btn active"; btnPng.className = "format-btn inactive"; }
    };
    btnPng.addEventListener('click', () => updateFormatUI('png')); btnSvg.addEventListener('click', () => updateFormatUI('svg'));

    // Download Button
    dlBtn.addEventListener('click', () => {
      if(!validateInputs().valid) return;
      const sizeSelect = document.getElementById('qr-size');
      let downloadSize = parseInt(sizeSelect.value) || 512;
      
      qrCode.update({ width: downloadSize, height: downloadSize });
      qrCode.download({ extension: selectedFormat, name: `QR_Master_${downloadSize}px` }).then(() => { 
        qrCode.update({ width: PREVIEW_SIZE, height: PREVIEW_SIZE }); 
      });
    });

    // ================= SMART SCANNER =================
    let html5QrCode, messageTimeout;
    const startCamBtn = document.getElementById('scan-camera-btn'), stopCamBtn = document.getElementById('stop-camera-btn'), camPlaceholder = document.getElementById('camera-placeholder'), resultContainer = document.getElementById('scan-result-container'), rawDataInput = document.getElementById('raw-scan-data'), richContentBox = document.getElementById('scan-rich-content'), scanTypeLabel = document.getElementById('scan-type-label');
    
    const showUIMessage = (text, isError = true) => {
      const msgBox = document.getElementById('ui-message'); document.getElementById('ui-message-text').textContent = text;
      msgBox.className = `alert-msg ${isError ? 'error' : 'success'}`;
      clearTimeout(messageTimeout); messageTimeout = setTimeout(() => msgBox.classList.add('hide'), 4000);
    };

    window.copyWifiPassword = (pwd) => {
      navigator.clipboard.writeText(pwd).then(() => { alert("WiFi Password Copied!"); });
    };

    const handleScanSuccess = (decodedText) => {
      stopScanner(); rawDataInput.value = decodedText; resultContainer.classList.remove('hide');
      let resultType = 'Text Scanned', icon = 'align-left', resultHTML = '';

      if (decodedText.toLowerCase().startsWith('upi://pay')) {
        resultType = 'UPI Payment Code'; icon = 'indian-rupee';
        let payeeName = 'Unknown Merchant', upiId = 'Unknown ID', amount = '';
        try {
          const upiUrl = new URL(decodedText);
          payeeName = upiUrl.searchParams.get('pn') || 'Unknown Merchant'; upiId = upiUrl.searchParams.get('pa') || 'Unknown ID';
          amount = upiUrl.searchParams.get('am') ? `₹${upiUrl.searchParams.get('am')}` : '';
        } catch(e) {
          const pnMatch = decodedText.match(/[?&]pn=([^&]+)/); const paMatch = decodedText.match(/[?&]pa=([^&]+)/);
          if(pnMatch) payeeName = decodeURIComponent(pnMatch[1]); if(paMatch) upiId = decodeURIComponent(paMatch[1]);
        }
        resultHTML = `<div class="app-res-box t-upi"><span class="l">Paying To:</span><span class="v">${payeeName}</span><span class="s">${upiId}</span>${amount ? `<span class="a">${amount}</span>` : ''}<a href="${decodedText}" class="app-res-btn b-upi"><i data-lucide="smartphone-nfc"></i> Pay with UPI App</a></div>`;
      }
      else if (decodedText.match(/wa\.me/i) || decodedText.match(/^whatsapp:/i)) {
        resultType = 'WhatsApp Action'; icon = 'message-circle';
        resultHTML = buildAppUI(decodedText, 't-wa', 'b-wa', 'message-circle', 'Chat on WhatsApp');
      }
      else if (decodedText.match(/^geo:/i) || decodedText.match(/maps\.google\.com/i) || decodedText.match(/goo\.gl\/maps/i)) {
        resultType = 'Location & Map'; icon = 'map-pin';
        resultHTML = buildAppUI(decodedText, 't-map', 'b-map', 'map-pin', 'Open in Maps');
      }
      else if (decodedText.match(/youtube\.com/i) || decodedText.match(/youtu\.be/i)) {
        resultType = 'YouTube Link'; icon = 'youtube'; resultHTML = buildAppUI(decodedText, 't-yt', 'b-yt', 'youtube', 'Open YouTube');
      } else if (decodedText.match(/instagram\.com/i)) {
        resultType = 'Instagram Profile'; icon = 'instagram'; resultHTML = buildAppUI(decodedText, 't-ig', 'b-ig', 'instagram', 'Open Instagram');
      } else if (decodedText.match(/facebook\.com/i) || decodedText.match(/fb\.me/i)) {
        resultType = 'Facebook Link'; icon = 'facebook'; resultHTML = buildAppUI(decodedText, 't-fb', 'b-fb', 'facebook', 'Open Facebook');
      } else if (decodedText.match(/linkedin\.com/i)) {
        resultType = 'LinkedIn Profile'; icon = 'linkedin'; resultHTML = buildAppUI(decodedText, 't-li', 'b-li', 'linkedin', 'Open LinkedIn');
      } else if (decodedText.match(/t\.me/i) || decodedText.match(/telegram\.me/i)) {
        resultType = 'Telegram Link'; icon = 'send'; resultHTML = buildAppUI(decodedText, 't-tg', 'b-tg', 'send', 'Open Telegram');
      } else if (decodedText.match(/play\.google\.com/i) || decodedText.match(/apps\.apple\.com/i)) {
        resultType = 'App Store Link'; icon = 'layout-grid'; resultHTML = buildAppUI(decodedText, 't-app', 'b-app', 'download', 'Download App');
      }
      else if (decodedText.startsWith('WIFI:')) {
        resultType = 'WiFi Network'; icon = 'wifi';
        let ssid = decodedText.match(/S:(.*?);/)?.[1] || 'Unknown'; let pwd = decodedText.match(/P:(.*?);/)?.[1] || '';
        resultHTML = `<div class="wifi-item"><span class="l">Network Name</span><span class="v">${ssid}</span></div><div class="wifi-item"><span class="l">Password</span><span class="v">${pwd ? pwd : 'No Password'}</span></div>${pwd ? `<button onclick="copyWifiPassword('${pwd.replace(/'/g, "\\'")}')" class="btn-general bg-dark"><i data-lucide="copy"></i> Copy Password</button>` : ''}`;
      } 
      else if (decodedText.startsWith('BEGIN:VCARD')) {
        resultType = 'Contact Details'; icon = 'contact';
        let name = decodedText.match(/FN:(.*?)\n/)?.[1] || 'Unknown'; let phone = decodedText.match(/TEL.*?:(.*?)\n/)?.[1] || '';
        resultHTML = `<div class="vcard-wrap"><span class="n">${name}</span>${phone ? `<span class="p"><i data-lucide="phone"></i> ${phone}</span>` : ''}</div>${phone ? `<a href="tel:${phone.replace(/\s+/g,'')}" class="btn-general bg-indigo"><i data-lucide="phone-call"></i> Call Now</a>` : ''}`;
      } 
      else if (/^https?:\/\//i.test(decodedText)) {
        resultType = 'Website URL'; icon = 'link';
        resultHTML = `<div class="app-res-box t-upi" style="border: 1px solid #e2e8f0; background-color: #eef2ff;"><span>${decodedText}</span><a href="${decodedText}" target="_blank" class="btn-general bg-indigo" style="margin-top: 0.25rem;"><i data-lucide="external-link"></i> Open Website</a></div>`;
      } 
      else if (decodedText.toLowerCase().startsWith('smsto:') || decodedText.toLowerCase().startsWith('tel:')) {
        resultType = 'Phone Action'; icon = 'phone';
        resultHTML = `<div class="plain-text">${decodedText.replace(/^(smsto:|tel:)/i, '')}</div><a href="${decodedText}" class="btn-general bg-green"><i data-lucide="smartphone"></i> Take Action</a>`;
      }
      else {
        resultHTML = `<div class="plain-text">${decodedText}</div>`;
      }

      scanTypeLabel.innerHTML = `<i data-lucide="${icon}"></i> ${resultType}`;
      richContentBox.innerHTML = resultHTML;
      lucide.createIcons();
      setTimeout(() => { resultContainer.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 150);
    };

    const buildAppUI = (url, themeClass, btnClass, lucideIcon, btnText) => {
      return `<div class="app-res-box ${themeClass}"><i data-lucide="${lucideIcon}"></i><span>${url}</span><a href="${url}" target="_blank" class="app-res-btn ${btnClass}"><i data-lucide="external-link"></i> ${btnText}</a></div>`;
    };

    const startScanner = () => {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      resultContainer.classList.add('hide'); camPlaceholder.style.display = 'none';
      startCamBtn.classList.add('hide'); stopCamBtn.classList.remove('hide');
      const config = { fps: 30, qrbox: { width: 280, height: 280 }, aspectRatio: 1.0, rememberLastUsedCamera: true };
      html5QrCode.start( { facingMode: "environment" }, config, 
        (decodedText) => { handleScanSuccess(decodedText); },
        (errorMessage) => { }
      ).catch(err => { showUIMessage("Camera permission denied.", true); stopScanner(); });
    };
    
    const stopScanner = () => {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => { startCamBtn.classList.remove('hide'); stopCamBtn.classList.add('hide'); camPlaceholder.style.display = 'flex'; }).catch(console.error);
      } else {
        startCamBtn.classList.remove('hide'); stopCamBtn.classList.add('hide'); camPlaceholder.style.display = 'flex';
      }
    };

    startCamBtn.addEventListener('click', startScanner); stopCamBtn.addEventListener('click', stopScanner);

    document.getElementById('copy-result-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(rawDataInput.value).then(() => {
        const iconBtn = document.getElementById('copy-result-btn');
        const icon = iconBtn.querySelector('i');
        icon.setAttribute('data-lucide', 'check'); iconBtn.classList.add('success'); lucide.createIcons();
        setTimeout(() => { icon.setAttribute('data-lucide', 'copy'); iconBtn.classList.remove('success'); lucide.createIcons(); }, 2000);
      });
    });
  </script>
</body>
</html>
