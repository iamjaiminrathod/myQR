<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Master | Premium UI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: '#4f46e5', // Elegant Indigo
            secondary: '#ec4899', // Pink
          },
          fontFamily: { 
            sans: ['Inter', 'sans-serif'],
            heading: ['Montserrat', 'sans-serif']
          },
          boxShadow: { 
            'glass': '0 10px 40px -10px rgba(0,0,0,0.05)',
            'premium-card': '0 4px 20px -2px rgba(0,0,0,0.03), 0 0 3px rgba(0,0,0,0.02)',
            'input-focus': '0 0 0 3px rgba(79, 70, 229, 0.15)'
          }
        }
      }
    }
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style type="text/tailwindcss">
    body {
      background-color: #f8fafc;
      background-image: radial-gradient(circle at top right, #e0e7ff 0%, transparent 40%), radial-gradient(circle at bottom left, #fce7f3 0%, transparent 40%);
      background-attachment: fixed;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 1);
    }
    .hide { display: none !important; }
    
    /* Scanner overrides */
    #reader { width: 100%; border: none !important; border-radius: 1.5rem; overflow: hidden; }
    #reader video { border-radius: 1.5rem; object-fit: cover; }
    #reader__scan_region { background: transparent; }
    #reader__dashboard_section_csr span, #reader__dashboard_section_swaplink { display: none !important; }
    
    /* Smooth Tab Indicator Transition */
    #tab-indicator { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col items-center p-3 sm:p-8">

  <header class="w-full max-w-5xl flex justify-center items-center mb-6 sm:mb-8 mt-2">
    <div class="flex items-center gap-3">
      <div class="bg-gradient-to-tr from-primary to-secondary p-2.5 rounded-xl text-white shadow-lg shadow-primary/30">
        <i data-lucide="qr-code" class="w-6 h-6 sm:w-7 sm:h-7"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-heading font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-600">QR Master</h1>
    </div>
  </header>

  <main class="w-full max-w-5xl glass-card rounded-[2rem] shadow-glass p-4 sm:p-8 flex flex-col transition-all relative">
    
    <div class="relative flex mb-8 bg-slate-100/50 p-1 rounded-xl max-w-sm mx-auto w-full border border-slate-200/50" id="tabs-container">
      <button id="tab-generator" class="flex-1 text-center py-2.5 flex justify-center items-center gap-2 font-semibold text-primary transition-colors relative z-10 text-sm">
        <i data-lucide="sparkles" class="w-4 h-4"></i> <span>Generator</span>
      </button>
      <button id="tab-scanner" class="flex-1 text-center py-2.5 flex justify-center items-center gap-2 font-semibold text-slate-500 hover:text-slate-700 transition-colors relative z-10 text-sm">
        <i data-lucide="scan-line" class="w-4 h-4"></i> <span>Scanner</span>
      </button>
      <div id="tab-indicator" class="absolute top-1 bottom-1 left-1 bg-white rounded-lg shadow-sm z-0 border border-slate-100"></div>
    </div>

    <div id="section-generator" class="grid grid-cols-1 lg:grid-cols-12 gap-8 sm:gap-10">
      <div class="lg:col-span-7 flex flex-col gap-6">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider pl-1">Data Type</label>
          <div class="grid grid-cols-3 gap-2 sm:gap-3" id="type-buttons">
            <button class="type-btn active bg-primary text-white shadow-md shadow-primary/20 px-2 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-semibold transition-all flex flex-col sm:flex-row items-center justify-center gap-1.5 border border-transparent" data-type="url"><i data-lucide="link" class="w-4 h-4 pointer-events-none"></i> URL</button>
            <button class="type-btn bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 px-2 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-medium transition-all flex flex-col sm:flex-row items-center justify-center gap-1.5" data-type="text"><i data-lucide="align-left" class="w-4 h-4 pointer-events-none"></i> Text</button>
            <button class="type-btn bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 px-2 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-medium transition-all flex flex-col sm:flex-row items-center justify-center gap-1.5" data-type="vcard"><i data-lucide="contact" class="w-4 h-4 pointer-events-none"></i> vCard</button>
            <button class="type-btn bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 px-2 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-medium transition-all flex flex-col sm:flex-row items-center justify-center gap-1.5" data-type="email"><i data-lucide="mail" class="w-4 h-4 pointer-events-none"></i> Email</button>
            <button class="type-btn bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 px-2 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-medium transition-all flex flex-col sm:flex-row items-center justify-center gap-1.5" data-type="sms"><i data-lucide="message-square-text" class="w-4 h-4 pointer-events-none"></i> SMS</button>
            <button class="type-btn bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 px-2 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-medium transition-all flex flex-col sm:flex-row items-center justify-center gap-1.5" data-type="wifi"><i data-lucide="wifi" class="w-4 h-4 pointer-events-none"></i> WiFi</button>
          </div>
        </div>

        <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-100 shadow-premium-card relative">
          <label class="flex items-center gap-2 text-[11px] font-bold text-slate-700 mb-4 uppercase tracking-widest"><span class="w-1.5 h-1.5 rounded-full bg-primary"></span> Content Details</label>
          <div id="dynamic-inputs" class="flex flex-col gap-3.5"></div>
          <div id="input-error-msg" class="text-rose-600 bg-rose-50 border border-rose-100 px-3 py-2.5 rounded-xl text-xs font-bold mt-4 flex items-center gap-2 transition-all">
            <i data-lucide="info" class="w-4 h-4"></i> <span id="error-msg-text">Please fill in the required details to generate QR.</span>
          </div>
        </div>

        <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-100 shadow-premium-card">
          <h3 class="text-sm font-semibold mb-5 text-slate-800 flex items-center gap-2">
            <div class="p-1.5 bg-indigo-50 rounded-lg text-primary"><i data-lucide="palette" class="w-4 h-4"></i></div> Customize Design
          </h3>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
            <div><label class="block text-[11px] font-semibold mb-1.5 text-slate-500 uppercase tracking-wide">QR Color</label><div class="border border-slate-200 rounded-xl overflow-hidden h-10 p-0.5 bg-white cursor-pointer"><input type="color" id="color-dark" value="#0f172a" class="w-full h-full cursor-pointer border-none p-0 bg-transparent rounded-lg"></div></div>
            <div><label class="block text-[11px] font-semibold mb-1.5 text-slate-500 uppercase tracking-wide">Background</label><div class="border border-slate-200 rounded-xl overflow-hidden h-10 p-0.5 bg-white cursor-pointer"><input type="color" id="color-light" value="#ffffff" class="w-full h-full cursor-pointer border-none p-0 bg-transparent rounded-lg"></div></div>
            <div><label class="block text-[11px] font-semibold mb-1.5 text-slate-500 uppercase tracking-wide">Pattern</label><select id="dots-style" class="w-full h-10 px-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold cursor-pointer"><option value="square">Square</option><option value="rounded" selected>Rounded</option></select></div>
            <div><label class="block text-[11px] font-semibold mb-1.5 text-slate-500 uppercase tracking-wide">Corners</label><select id="corners-style" class="w-full h-10 px-3 rounded-xl border border-slate-200 bg-slate-50 text-xs font-semibold cursor-pointer"><option value="square">Square</option><option value="extra-rounded" selected>Rounded</option></select></div>
          </div>
          <div>
            <label class="block text-[11px] font-semibold mb-2 text-slate-500 uppercase tracking-wide">Center Logo</label>
            <div class="flex items-center gap-3">
              <label class="bg-slate-50 border border-dashed border-slate-300 hover:border-primary hover:bg-indigo-50 text-slate-600 px-4 py-2.5 rounded-xl text-xs font-semibold cursor-pointer flex items-center gap-2"><i data-lucide="image-plus" class="w-4 h-4 text-primary"></i> Upload Logo<input type="file" id="logo-input" accept="image/*" class="hidden"></label>
              <button id="clear-logo" class="hide flex items-center gap-1.5 text-rose-500 bg-rose-50 border border-rose-100 px-4 py-2.5 rounded-xl text-xs font-semibold"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Remove</button>
            </div>
          </div>
        </div>
      </div>

      <div class="lg:col-span-5 flex flex-col items-center">
        <div class="w-full bg-white rounded-3xl p-5 sm:p-8 border border-slate-100 shadow-premium-card flex flex-col items-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary opacity-80"></div>
          <h3 class="text-xs font-bold text-slate-400 mb-8 uppercase tracking-widest flex items-center gap-2"><span id="preview-indicator" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Preview</h3>
          
          <div id="qr-preview-wrapper" class="bg-white p-3 rounded-2xl shadow-[0_15px_40px_-10px_rgba(0,0,0,0.1)] mb-10 transition-all duration-500 w-[200px] h-[200px] sm:w-[240px] sm:h-[240px] flex items-center justify-center border border-slate-50 opacity-30 grayscale blur-[2px]"></div>

          <div class="w-full max-w-[280px] flex flex-col gap-5">
            <div class="flex flex-col gap-1.5"><label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Resolution</label><select id="qr-size" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 text-sm font-semibold cursor-pointer"><option value="256">256 x 256 px</option><option value="512" selected>512 x 512 px (Standard)</option><option value="1024">1024 x 1024 px</option><option value="2048">2048 x 2048 px</option><option value="custom">Custom Size...</option></select><input type="number" id="custom-px-input" placeholder="e.g. 800" class="hide w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium mt-2" min="100" max="4000"></div>
            <div><label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">Format</label><div class="flex gap-2 bg-slate-50 p-1.5 rounded-xl border border-slate-100"><button id="btn-format-png" class="format-btn active flex-1 py-2.5 rounded-lg bg-white text-primary font-bold flex justify-center items-center gap-1.5 shadow-sm border border-slate-200 text-sm">PNG</button><button id="btn-format-svg" class="format-btn flex-1 py-2.5 rounded-lg bg-transparent text-slate-500 font-semibold flex justify-center items-center gap-1.5 text-sm">SVG</button></div></div>
            <button id="main-download-btn" class="w-full mt-3 flex justify-center items-center gap-2 bg-primary hover:bg-indigo-700 text-white py-4 rounded-xl text-sm font-bold shadow-lg shadow-primary/30 transition-all opacity-50 cursor-not-allowed"><i data-lucide="download" class="w-4 h-4"></i> Download QR Code</button>
          </div>
        </div>
      </div>
    </div>

    <div id="section-scanner" class="hide flex flex-col items-center py-6 w-full max-w-lg mx-auto relative z-10">
      
      <div id="ui-message" class="hide w-full mb-5 px-5 py-4 rounded-xl text-sm font-semibold flex items-center gap-3 shadow-sm border">
        <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i><span id="ui-message-text"></span>
      </div>

      <div class="w-full bg-white p-2.5 rounded-[2rem] shadow-glass border border-slate-100">
        <div id="reader" class="w-full min-h-[320px] flex items-center justify-center bg-slate-100/80 rounded-[1.5rem] text-slate-400 overflow-hidden relative border border-slate-200/50">
          <span id="camera-placeholder" class="flex flex-col items-center gap-4">
            <div class="p-4 bg-white rounded-full shadow-sm border border-slate-100"><i data-lucide="camera" class="w-8 h-8 text-slate-300"></i></div>
            <span class="text-xs font-bold uppercase tracking-widest">Camera inactive</span>
          </span>
        </div>
        
        <div class="flex justify-center gap-3 mt-5 px-3 pb-3">
          <button id="scan-camera-btn" class="w-full bg-primary text-white py-3.5 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-indigo-600 transition-all shadow-md shadow-primary/20">
            <i data-lucide="video" class="w-5 h-5"></i> Start Scan
          </button>
          <button id="stop-camera-btn" class="hide w-full bg-slate-800 text-white py-3.5 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-slate-900 transition-all shadow-md">
            <i data-lucide="square" class="w-4 h-4 fill-current"></i> Stop
          </button>
        </div>
      </div>

      <div id="scan-result-container" class="hide mt-8 w-full p-5 bg-white border border-slate-200 rounded-2xl shadow-premium-card transition-all">
        <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
           <h4 id="scan-type-label" class="text-sm font-extrabold text-primary flex items-center gap-2 uppercase tracking-wide">
             <i data-lucide="check-circle-2" class="w-5 h-5"></i> Scan Successful
           </h4>
           <button id="copy-result-btn" class="p-2 bg-slate-50 rounded-lg text-slate-500 hover:text-primary hover:bg-indigo-50 transition-colors border border-slate-200" title="Copy Data">
             <i data-lucide="copy" class="w-4 h-4"></i>
           </button>
        </div>
        
        <div id="scan-rich-content" class="text-sm text-slate-600 space-y-2"></div>
        <textarea id="raw-scan-data" class="hidden"></textarea>
      </div>
    </div>

  </main>

  <footer class="w-full max-w-5xl mx-auto mt-6 mb-6 text-center text-slate-500 text-sm">
    © 2026 QR Master — Built by jaimin.web
  </footer>

  <script>
    lucide.createIcons();

    // Tabs Logic
    const tabs = { gen: document.getElementById('tab-generator'), scan: document.getElementById('tab-scanner') };
    const sections = { gen: document.getElementById('section-generator'), scan: document.getElementById('section-scanner') };
    const indicator = document.getElementById('tab-indicator');

    const updateIndicator = (activeTab) => { indicator.style.width = `${activeTab.offsetWidth}px`; indicator.style.left = `${activeTab.offsetLeft}px`; };
    window.addEventListener('load', () => updateIndicator(tabs.gen));
    window.addEventListener('resize', () => { updateIndicator(!sections.scan.classList.contains('hide') ? tabs.scan : tabs.gen); });

    const switchTab = (tabName) => {
      Object.values(sections).forEach(sec => sec.classList.add('hide'));
      Object.values(tabs).forEach(tab => tab.classList.replace('text-primary', 'text-slate-500'));
      sections[tabName].classList.remove('hide');
      tabs[tabName].classList.replace('text-slate-500', 'text-primary');
      updateIndicator(tabs[tabName]);
      if (tabName !== 'scan') stopScanner();
    };

    tabs.gen.addEventListener('click', () => switchTab('gen'));
    tabs.scan.addEventListener('click', () => switchTab('scan'));

    // Generator Initialization
    const PREVIEW_SIZE = 220; 
    const qrOptions = { width: PREVIEW_SIZE, height: PREVIEW_SIZE, data: "https://qrmaster.com", margin: 5, imageOptions: { hideBackgroundDots: true, imageSize: 0.4, margin: 5 }, dotsOptions: { color: "#0f172a", type: "rounded" }, backgroundOptions: { color: "#ffffff" }, cornersSquareOptions: { color: "#0f172a", type: "extra-rounded" }, cornersDotOptions: { color: "#0f172a", type: "dot" } };
    const qrCode = new QRCodeStyling(qrOptions);
    qrCode.append(document.getElementById("qr-preview-wrapper"));

    const inputClass = "w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-sm hover:border-slate-300 focus:bg-white focus:border-primary focus:ring-[3px] focus:ring-indigo-100 outline-none transition-all placeholder:text-slate-400 font-medium";

    const inputTemplates = {
      url: `<input type="url" id="val-url" placeholder="https://your-website.com" class="${inputClass}" maxlength="2048">`,
      text: `<textarea id="val-text" placeholder="Type your message here..." class="${inputClass}" rows="3" maxlength="500"></textarea>`,
      email: `<input type="email" id="val-email" placeholder="Recipient Email" class="${inputClass}" maxlength="255"><input type="text" id="val-sub" placeholder="Subject" class="${inputClass}" maxlength="100"><textarea id="val-body" placeholder="Message Body" class="${inputClass}" rows="2" maxlength="500"></textarea>`,
      sms: `<input type="tel" id="val-phone" placeholder="Phone Number (e.g. 9876543210)" class="${inputClass}" maxlength="15"><textarea id="val-sms-body" placeholder="Message text" class="${inputClass}" rows="2" maxlength="160"></textarea>`,
      wifi: `<input type="text" id="val-ssid" placeholder="Network Name (SSID)" class="${inputClass}" maxlength="32"><input type="password" id="val-pw" placeholder="Password" class="${inputClass}" maxlength="63"><select id="val-enc" class="${inputClass} cursor-pointer hover:bg-slate-50/50"><option value="WPA">WPA / WPA2</option><option value="WEP">WEP</option><option value="nopass">No Encryption</option></select>`,
      vcard: `<div class="grid grid-cols-2 gap-3"><input type="text" id="val-fname" placeholder="First Name" class="${inputClass}" maxlength="50"><input type="text" id="val-lname" placeholder="Last Name" class="${inputClass}" maxlength="50"></div><input type="tel" id="val-vc-phone" placeholder="Mobile Number" class="${inputClass}" maxlength="15"><input type="email" id="val-vc-email" placeholder="Email Address (Optional)" class="${inputClass}" maxlength="255"><input type="text" id="val-org" placeholder="Company / Organization" class="${inputClass}" maxlength="100">`
    };

    let currentType = 'url';
    const dynamicInputs = document.getElementById('dynamic-inputs');
    const errorMsgBox = document.getElementById('input-error-msg');
    const errorText = document.getElementById('error-msg-text');
    const dlBtn = document.getElementById('main-download-btn');
    const qrWrapper = document.getElementById('qr-preview-wrapper');
    const indicatorDot = document.getElementById('preview-indicator');
    
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const targetBtn = e.target.closest('.type-btn');
        document.querySelectorAll('.type-btn').forEach(b => b.className = "type-btn bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 px-2 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-medium transition-all flex flex-col sm:flex-row items-center justify-center gap-1.5");
        targetBtn.className = "type-btn active bg-primary text-white shadow-md shadow-primary/20 px-2 py-2.5 sm:py-3 rounded-xl text-xs sm:text-sm font-semibold transition-all flex flex-col sm:flex-row items-center justify-center gap-1.5 border border-transparent";
        currentType = targetBtn.dataset.type;
        dynamicInputs.innerHTML = inputTemplates[currentType];
        lucide.createIcons();
        attachInputListeners();
        validateAndUpdateQR();
      });
    });

    dynamicInputs.innerHTML = inputTemplates['url'];
    lucide.createIcons();

    // Validations
    const validateInputs = () => {
      const getVal = (id) => document.getElementById(id)?.value.trim() || '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
      const phoneRegex = /^\+?[0-9\s\-]{7,15}$/;

      switch(currentType) {
        case 'url': return (!getVal('val-url')) ? {valid:false, msg:'Please enter a URL.'} : (!urlRegex.test(getVal('val-url'))) ? {valid:false, msg:'Please enter a valid URL.'} : {valid:true};
        case 'text': return getVal('val-text') ? {valid:true} : {valid:false, msg:'Please enter some text.'};
        case 'email': return (!getVal('val-email')) ? {valid:false, msg:'Please enter recipient email.'} : (!emailRegex.test(getVal('val-email'))) ? {valid:false, msg:'Please enter a valid email.'} : {valid:true};
        case 'sms': return (!getVal('val-phone')) ? {valid:false, msg:'Please enter a phone number.'} : (!phoneRegex.test(getVal('val-phone'))) ? {valid:false, msg:'Phone must be valid (max 15 digits).'} : {valid:true};
        case 'wifi': return getVal('val-ssid') ? {valid:true} : {valid:false, msg:'Please enter Network Name (SSID).'};
        case 'vcard': 
          if (!getVal('val-fname') && !getVal('val-vc-phone')) return {valid:false, msg:'Please enter First Name or Phone.'};
          if (getVal('val-vc-phone') && !phoneRegex.test(getVal('val-vc-phone'))) return {valid:false, msg:'Phone must be valid (max 15 digits).'};
          if (getVal('val-vc-email') && !emailRegex.test(getVal('val-vc-email'))) return {valid:false, msg:'Please enter a valid email.'};
          return {valid:true};
      }
    };

    const getFormattedData = () => {
      const getVal = (id) => document.getElementById(id)?.value.trim() || '';
      switch(currentType) {
        case 'url': return (/^https?:\/\//i.test(getVal('val-url'))) ? getVal('val-url') : 'https://' + getVal('val-url');
        case 'text': return getVal('val-text');
        case 'email': return `mailto:${getVal('val-email')}?subject=${encodeURIComponent(getVal('val-sub'))}&body=${encodeURIComponent(getVal('val-body'))}`;
        case 'sms': return `smsto:${getVal('val-phone')}:${getVal('val-sms-body')}`;
        case 'wifi': return `WIFI:T:${getVal('val-enc')};S:${getVal('val-ssid')};P:${getVal('val-pw')};;`;
        case 'vcard': return `BEGIN:VCARD\nVERSION:3.0\nN:${getVal('val-lname')};${getVal('val-fname')}\nFN:${getVal('val-fname')} ${getVal('val-lname')}\nTEL;TYPE=CELL:${getVal('val-vc-phone')}\nEMAIL:${getVal('val-vc-email')}\nORG:${getVal('val-org')}\nEND:VCARD`;
      }
    };

    const validateAndUpdateQR = () => {
      const validation = validateInputs();
      if(!validation.valid) {
        errorText.textContent = validation.msg; errorMsgBox.classList.remove('hide'); qrWrapper.classList.add('opacity-30', 'grayscale', 'blur-[2px]'); qrWrapper.classList.remove('hover:-translate-y-1'); dlBtn.classList.add('opacity-50', 'cursor-not-allowed'); indicatorDot.classList.replace('bg-emerald-400', 'bg-slate-300'); indicatorDot.classList.remove('animate-pulse');
      } else {
        errorMsgBox.classList.add('hide'); qrWrapper.classList.remove('opacity-30', 'grayscale', 'blur-[2px]'); qrWrapper.classList.add('hover:-translate-y-1'); dlBtn.classList.remove('opacity-50', 'cursor-not-allowed'); indicatorDot.classList.replace('bg-slate-300', 'bg-emerald-400'); indicatorDot.classList.add('animate-pulse');
        qrOptions.data = getFormattedData(); qrCode.update(qrOptions);
      }
    };

    const attachInputListeners = () => { 
      dynamicInputs.querySelectorAll('input, textarea, select').forEach(el => {
        if(el.type === 'tel') { el.addEventListener('keypress', (e) => { if(!/[0-9+\- ]/.test(e.key)) e.preventDefault(); }); }
        el.addEventListener('input', validateAndUpdateQR);
      }); 
    };
    attachInputListeners(); validateAndUpdateQR();

    // Design Listeners
    document.getElementById('color-dark').addEventListener('input', (e) => { qrOptions.dotsOptions.color = e.target.value; qrOptions.cornersSquareOptions.color = e.target.value; qrOptions.cornersDotOptions.color = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('color-light').addEventListener('input', (e) => { qrOptions.backgroundOptions.color = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('dots-style').addEventListener('change', (e) => { qrOptions.dotsOptions.type = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('corners-style').addEventListener('change', (e) => { qrOptions.cornersSquareOptions.type = e.target.value; qrOptions.cornersDotOptions.type = e.target.value === 'extra-rounded' ? 'dot' : 'square'; qrCode.update(qrOptions); });

    const logoInput = document.getElementById('logo-input'), clearLogoBtn = document.getElementById('clear-logo');
    logoInput.addEventListener('change', function(e) { if(e.target.files[0]) { const reader = new FileReader(); reader.onload = (ev) => { qrOptions.image = ev.target.result; qrCode.update(qrOptions); clearLogoBtn.classList.remove('hide'); }; reader.readAsDataURL(e.target.files[0]); }});
    clearLogoBtn.addEventListener('click', () => { logoInput.value = ''; qrOptions.image = null; qrCode.update(qrOptions); clearLogoBtn.classList.add('hide'); });

    // Download 
    const sizeSelect = document.getElementById('qr-size'), customPxInput = document.getElementById('custom-px-input');
    sizeSelect.addEventListener('change', (e) => { if(e.target.value === 'custom') { customPxInput.classList.remove('hide'); customPxInput.focus(); } else { customPxInput.classList.add('hide'); }});

    let selectedFormat = 'png';
    const btnPng = document.getElementById('btn-format-png'), btnSvg = document.getElementById('btn-format-svg');
    const updateFormatUI = (format) => {
      selectedFormat = format;
      if(format === 'png') { btnPng.className = "format-btn active flex-1 py-2.5 rounded-lg bg-white text-primary font-bold shadow-sm border border-slate-200 text-sm flex justify-center items-center gap-1.5"; btnSvg.className = "format-btn flex-1 py-2.5 rounded-lg bg-transparent text-slate-500 font-semibold hover:text-slate-700 text-sm flex justify-center items-center gap-1.5"; }
      else { btnSvg.className = "format-btn active flex-1 py-2.5 rounded-lg bg-white text-primary font-bold shadow-sm border border-slate-200 text-sm flex justify-center items-center gap-1.5"; btnPng.className = "format-btn flex-1 py-2.5 rounded-lg bg-transparent text-slate-500 font-semibold hover:text-slate-700 text-sm flex justify-center items-center gap-1.5"; }
    };
    btnPng.addEventListener('click', () => updateFormatUI('png')); btnSvg.addEventListener('click', () => updateFormatUI('svg'));

    dlBtn.addEventListener('click', () => {
      if(!validateInputs().valid) return;
      let downloadSize = sizeSelect.value === 'custom' ? (parseInt(customPxInput.value) || 512) : parseInt(sizeSelect.value);
      qrCode.update({ width: downloadSize, height: downloadSize });
      qrCode.download({ extension: selectedFormat, name: `QR_Master_${downloadSize}px` }).then(() => { qrCode.update({ width: PREVIEW_SIZE, height: PREVIEW_SIZE }); });
    });

    // ================= SMART SCANNER WITH UPI, WIFI, REDIRECTS =================
    let html5QrCode, messageTimeout;
    const startCamBtn = document.getElementById('scan-camera-btn'), stopCamBtn = document.getElementById('stop-camera-btn'), camPlaceholder = document.getElementById('camera-placeholder'), resultContainer = document.getElementById('scan-result-container'), rawDataInput = document.getElementById('raw-scan-data'), richContentBox = document.getElementById('scan-rich-content'), scanTypeLabel = document.getElementById('scan-type-label');
    
    const showUIMessage = (text, isError = true) => {
      const msgBox = document.getElementById('ui-message'); document.getElementById('ui-message-text').textContent = text;
      msgBox.className = `w-full mb-5 px-5 py-4 rounded-xl text-sm font-semibold flex items-center gap-3 shadow-sm transform scale-100 border ${isError ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`;
      clearTimeout(messageTimeout); messageTimeout = setTimeout(() => msgBox.classList.add('hide'), 4000);
    };

    window.copyWifiPassword = (pwd) => {
      navigator.clipboard.writeText(pwd).then(() => { alert("WiFi Password Copied!"); });
    };

    const handleScanSuccess = (decodedText) => {
      stopScanner(); rawDataInput.value = decodedText; resultContainer.classList.remove('hide');
      
      let resultType = 'Text Scanned', icon = 'align-left', resultHTML = '';

      // 1. UPI QR Code Detect
      if (decodedText.toLowerCase().startsWith('upi://pay')) {
        resultType = 'UPI Payment Code'; icon = 'wallet';
        
        // Extract parameters safely
        let payeeName = 'Unknown Merchant';
        let upiId = 'Unknown ID';
        try {
          const upiUrl = new URL(decodedText);
          payeeName = upiUrl.searchParams.get('pn') || 'Unknown Merchant';
          upiId = upiUrl.searchParams.get('pa') || 'Unknown ID';
        } catch(e) {
          // Fallback regex if URL parse fails
          const pnMatch = decodedText.match(/[?&]pn=([^&]+)/);
          const paMatch = decodedText.match(/[?&]pa=([^&]+)/);
          if(pnMatch) payeeName = decodeURIComponent(pnMatch[1]);
          if(paMatch) upiId = decodeURIComponent(paMatch[1]);
        }

        resultHTML = `
          <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100 flex flex-col items-center text-center gap-3">
             <div class="text-sm">
                <p class="text-slate-500 font-semibold mb-1">Paying To:</p>
                <p class="font-black text-lg text-slate-800">${payeeName}</p>
                <p class="text-xs text-slate-500 mt-1 font-medium break-all">${upiId}</p>
             </div>
             <a href="${decodedText}" class="w-full px-5 py-3.5 bg-[#1ea271] text-white text-sm font-bold rounded-xl hover:bg-[#16855b] transition-colors shadow-sm flex justify-center items-center gap-2 mt-2">
                <i data-lucide="smartphone-nfc" class="w-4 h-4"></i> Pay with UPI App
             </a>
          </div>
        `;
      }
      // 2. WiFi
      else if (decodedText.startsWith('WIFI:')) {
        resultType = 'WiFi Network'; icon = 'wifi';
        let ssid = decodedText.match(/S:(.*?);/)?.[1] || 'Unknown';
        let pwd = decodedText.match(/P:(.*?);/)?.[1] || '';
        resultHTML = `
          <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-100">
            <span class="font-bold text-slate-500 uppercase text-xs">Network Name</span> <span class="font-bold text-slate-900">${ssid}</span>
          </div>
          <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-100 mt-2">
            <span class="font-bold text-slate-500 uppercase text-xs">Password</span> 
            <span class="font-bold text-slate-900">${pwd ? pwd : 'No Password'}</span>
          </div>
          ${pwd ? `<button onclick="copyWifiPassword('${pwd.replace(/'/g, "\\'")}')" class="w-full mt-3 px-4 py-3 bg-slate-900 text-white text-sm font-bold rounded-xl hover:bg-slate-800 transition-colors shadow-sm flex justify-center items-center gap-2"><i data-lucide="copy" class="w-4 h-4"></i> Copy Password to Connect</button>` : ''}
        `;
      } 
      // 3. Contact (vCard)
      else if (decodedText.startsWith('BEGIN:VCARD')) {
        resultType = 'Contact Details'; icon = 'contact';
        let name = decodedText.match(/FN:(.*?)\n/)?.[1] || 'Unknown';
        let phone = decodedText.match(/TEL.*?:(.*?)\n/)?.[1] || '';
        resultHTML = `
          <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 flex flex-col gap-2">
             <p class="font-black text-lg text-slate-900">${name}</p>
             ${phone ? `<p class="font-semibold text-slate-600 flex items-center gap-2"><i data-lucide="phone" class="w-4 h-4 text-slate-400"></i> ${phone}</p>` : ''}
          </div>
          ${phone ? `<a href="tel:${phone.replace(/\s+/g,'')}" class="mt-3 w-full px-4 py-3 bg-primary text-white text-sm font-bold rounded-xl hover:bg-indigo-700 flex justify-center items-center gap-2 shadow-sm"><i data-lucide="phone-call" class="w-4 h-4"></i> Call Now</a>` : ''}
        `;
      } 
      // 4. URL
      else if (/^https?:\/\//i.test(decodedText)) {
        resultType = 'Website URL'; icon = 'link';
        resultHTML = `
          <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100 flex flex-col items-center text-center gap-3">
             <span class="text-sm font-semibold text-slate-700 break-all">${decodedText}</span>
             <a href="${decodedText}" target="_blank" class="w-full px-5 py-3 bg-primary text-white text-sm font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm flex justify-center items-center gap-2 mt-1"><i data-lucide="external-link" class="w-4 h-4"></i> Open Website</a>
          </div>
        `;
      } 
      // 5. Phone / SMS direct
      else if (decodedText.toLowerCase().startsWith('smsto:') || decodedText.toLowerCase().startsWith('tel:')) {
        resultType = 'Phone Action'; icon = 'phone';
        resultHTML = `
          <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 font-bold text-slate-700 break-all text-center">${decodedText.replace(/^(smsto:|tel:)/i, '')}</div>
          <a href="${decodedText}" class="w-full mt-3 px-4 py-3 bg-emerald-500 text-white text-sm font-bold rounded-xl hover:bg-emerald-600 transition-colors flex justify-center items-center gap-2 shadow-sm"><i data-lucide="smartphone" class="w-4 h-4"></i> Take Action</a>
        `;
      }
      // 6. Generic Text
      else {
        resultHTML = `<div class="p-4 bg-slate-50 rounded-xl border border-slate-100 font-medium text-slate-700 break-all whitespace-pre-wrap">${decodedText}</div>`;
      }

      scanTypeLabel.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i> ${resultType}`;
      richContentBox.innerHTML = resultHTML;
      lucide.createIcons();

      setTimeout(() => { resultContainer.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 150);
    };


    const startScanner = () => {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    
      resultContainer.classList.add('hide'); 
      camPlaceholder.style.display = 'none';
      startCamBtn.classList.add('hide'); 
      stopCamBtn.classList.remove('hide');
    
      const config = { 
        fps: 30, 
        qrbox: { width: 300, height: 300 },
        aspectRatio: 1.0,
        rememberLastUsedCamera: true
      };
  
      // 'environment' camera (back camera) use karo
      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        (decodedText) => {
          // SUCCESS: Scan mil gaya
          handleScanSuccess(decodedText);
        },
        (errorMessage) => {
        
        }
      ).catch(err => { 
        showUIMessage("You don't have permission. Check permissions.", true); 
        stopScanner(); 
      });
    };
    
    const stopScanner = () => {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => { startCamBtn.classList.remove('hide'); stopCamBtn.classList.add('hide'); camPlaceholder.style.display = 'flex'; }).catch(console.error);
      } else {
        startCamBtn.classList.remove('hide'); stopCamBtn.classList.add('hide'); camPlaceholder.style.display = 'flex';
      }
    };

    startCamBtn.addEventListener('click', startScanner);
    stopCamBtn.addEventListener('click', stopScanner);

    document.getElementById('copy-result-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(rawDataInput.value).then(() => {
        const icon = document.querySelector('#copy-result-btn i');
        icon.setAttribute('data-lucide', 'check'); icon.classList.add('text-primary'); lucide.createIcons();
        setTimeout(() => { icon.setAttribute('data-lucide', 'copy'); icon.classList.remove('text-primary'); lucide.createIcons(); }, 2000);
      });
    });
  </script>
</body>
</html>
