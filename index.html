<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Master | Premium UI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: '#4f46e5', // Elegant Indigo
            secondary: '#ec4899', // Pink
          },
          fontFamily: { 
            sans: ['Inter', 'sans-serif'],
            heading: ['Montserrat', 'sans-serif']
          },
          boxShadow: { 
            'glass': '0 10px 40px -10px rgba(0,0,0,0.05)',
            'premium-card': '0 4px 20px -2px rgba(0,0,0,0.03), 0 0 3px rgba(0,0,0,0.02)',
            'input-focus': '0 0 0 3px rgba(79, 70, 229, 0.15)'
          }
        }
      }
    }
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style type="text/tailwindcss">
    html, body {
      /* Fix for horizontal bounce but allows normal vertical scroll */
      max-width: 100vw;
      overflow-x: hidden;
    }

    body {
      background-color: #f8fafc;
      background-image: radial-gradient(circle at top right, #e0e7ff 0%, transparent 40%), radial-gradient(circle at bottom left, #fce7f3 0%, transparent 40%);
      background-attachment: fixed;
      /* Protect Content from being copied */
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* Allow text selection ONLY in input fields and textareas */
    input, textarea, select {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    /* Prevent image dragging and interaction on QR Code canvas to block saving */
    img, svg, canvas { -webkit-user-drag: none; }
    #qr-preview-wrapper canvas, #qr-preview-wrapper svg { pointer-events: none; }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 1);
    }
    .hide { display: none !important; }
    
    /* Scanner overrides for perfect fit */
    #reader { width: 100%; min-height: 320px; border: none !important; border-radius: 1.5rem; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; background: #f1f5f9; }
    #reader video { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; object-fit: cover !important; border-radius: 1.5rem; }
    #reader canvas { display: none !important; }
    #reader__scan_region { background: transparent; z-index: 10; width: 100%; height: 100%; }
    #reader__dashboard_section_csr span, #reader__dashboard_section_swaplink { display: none !important; }
    
    /* Smooth Tab Indicator Transition */
    #tab-indicator { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    
    /* Global scrollbar for app */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* --- DATA TYPES LAYOUT STYLES --- */
    
    /* Fix active colors so SVG goes perfectly white! */
    .type-btn.active i, .type-btn.active svg { color: #ffffff !important; }

    /* Hide scrollbars for Scroll View */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Scroll View Classes */
    .view-scroll { 
      display: flex; 
      overflow-x: auto; 
      scroll-snap-type: x mandatory; 
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .view-scroll .type-btn { flex: 0 0 auto; width: 76px; scroll-snap-align: start; }
    @media (min-width: 640px) { .view-scroll .type-btn { width: 86px; } }

    /* Grid View Classes - Butter Smooth iOS Scroll */
    .view-grid { 
      display: grid; 
      grid-template-columns: repeat(3, minmax(0, 1fr)); 
      max-height: 220px; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; /* Momentum scrolling on iOS */
      scroll-behavior: smooth;
      padding-bottom: 24px;
    }
    @media (min-width: 640px) { .view-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (min-width: 768px) { .view-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
    .view-grid .type-btn { width: 100%; }

    /* Custom elegant scrollbar for the Grid View to make it feel premium */
    .view-grid::-webkit-scrollbar { width: 4px; }
    .view-grid::-webkit-scrollbar-track { background: transparent; }
    .view-grid::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 10px; }
  </style>
</head>

      <div class="lg:col-span-5 flex flex-col items-center">
        <div class="w-full bg-white rounded-3xl p-5 sm:p-8 border border-slate-100 shadow-premium-card flex flex-col items-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary opacity-80"></div>
          <h3 class="text-xs font-bold text-slate-400 mb-8 uppercase tracking-widest flex items-center gap-2"><span id="preview-indicator" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Live Preview</h3>
          
          <div id="qr-preview-wrapper" class="bg-white p-3 rounded-2xl shadow-[0_15px_40px_-10px_rgba(0,0,0,0.1)] mb-10 transition-all duration-500 w-[200px] h-[200px] sm:w-[240px] sm:h-[240px] flex items-center justify-center border border-slate-50 opacity-30 grayscale blur-[2px]"></div>

          <div class="w-full max-w-[280px] flex flex-col gap-5">
            <div class="flex flex-col gap-1.5">
              <label class="block text-[11px] font-semibold text-slate-500 uppercase tracking-wide">Resolution</label>
              <select id="qr-size" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 text-sm font-semibold cursor-pointer">
                <option value="256">256 x 256 px</option>
                <option value="512" selected>512 x 512 px (Standard)</option>
                <option value="1024">1024 x 1024 px</option>
                <option value="2048">2048 x 2048 px</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1.5 uppercase tracking-wide">Format</label>
              <div class="flex gap-2 bg-slate-50 p-1.5 rounded-xl border border-slate-100"><button id="btn-format-png" class="format-btn active flex-1 py-2.5 rounded-lg bg-white text-primary font-bold flex justify-center items-center gap-1.5 shadow-sm border border-slate-200 text-sm">PNG</button><button id="btn-format-svg" class="format-btn flex-1 py-2.5 rounded-lg bg-transparent text-slate-500 font-semibold flex justify-center items-center gap-1.5 text-sm">SVG</button></div>
            </div>
            <button id="main-download-btn" class="w-full mt-3 flex justify-center items-center gap-2 bg-primary hover:bg-indigo-700 text-white py-4 rounded-xl text-sm font-bold shadow-lg shadow-primary/30 transition-all opacity-50 cursor-not-allowed"><i data-lucide="download" class="w-4 h-4"></i> Download QR Code</button>
          </div>
        </div>
      </div>
    </div>

    <div id="section-scanner" class="hide flex flex-col items-center py-6 w-full max-w-lg mx-auto relative z-10">
      
      <div id="ui-message" class="hide w-full mb-5 px-5 py-4 rounded-xl text-sm font-semibold flex items-center gap-3 shadow-sm border">
        <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i><span id="ui-message-text"></span>
      </div>

      <div class="w-full bg-white p-2.5 rounded-[2rem] shadow-glass border border-slate-100">
        <div id="reader" class="w-full min-h-[320px] bg-slate-100/80 rounded-[1.5rem] text-slate-400 overflow-hidden relative border border-slate-200/50">
          <span id="camera-placeholder" class="flex flex-col items-center justify-center h-[320px] gap-4 z-20 relative">
            <div class="p-4 bg-white rounded-full shadow-sm border border-slate-100"><i data-lucide="camera" class="w-8 h-8 text-slate-300"></i></div>
            <span class="text-xs font-bold uppercase tracking-widest">Camera inactive</span>
          </span>
        </div>
        
        <div class="flex justify-center gap-3 mt-5 px-3 pb-3">
          <button id="scan-camera-btn" class="w-full bg-primary text-white py-3.5 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-indigo-600 transition-all shadow-md shadow-primary/20">
            <i data-lucide="video" class="w-5 h-5"></i> Start Scan
          </button>
          <button id="stop-camera-btn" class="hide w-full bg-slate-800 text-white py-3.5 rounded-xl text-sm font-bold flex justify-center items-center gap-2 hover:bg-slate-900 transition-all shadow-md">
            <i data-lucide="square" class="w-4 h-4 fill-current"></i> Stop
          </button>
        </div>
      </div>

      <div id="scan-result-container" class="hide mt-8 w-full p-5 bg-white border border-slate-200 rounded-2xl shadow-premium-card transition-all">
        <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
           <h4 id="scan-type-label" class="text-sm font-extrabold text-primary flex items-center gap-2 uppercase tracking-wide">
             <i data-lucide="check-circle-2" class="w-5 h-5"></i> Scan Successful
           </h4>
           <button id="copy-result-btn" class="p-2 bg-slate-50 rounded-lg text-slate-500 hover:text-primary hover:bg-indigo-50 transition-colors border border-slate-200" title="Copy Data">
             <i data-lucide="copy" class="w-4 h-4"></i>
           </button>
        </div>
        
        <div id="scan-rich-content" class="text-sm text-slate-600 space-y-2 select-text"></div>
        <textarea id="raw-scan-data" class="hidden"></textarea>
      </div>
    </div>

  </main>

  <footer class="w-full max-w-5xl mx-auto mt-6 mb-6 text-center text-slate-500 text-sm pointer-events-none">
    © 2026 QR Master — Built by jaimin.web
  </footer>

  <script>
    lucide.createIcons();

    // ================= Tabs Logic =================
    const tabs = { gen: document.getElementById('tab-generator'), scan: document.getElementById('tab-scanner') };
    const sections = { gen: document.getElementById('section-generator'), scan: document.getElementById('section-scanner') };
    const indicator = document.getElementById('tab-indicator');

    const updateIndicator = (activeTab) => { indicator.style.width = `${activeTab.offsetWidth}px`; indicator.style.left = `${activeTab.offsetLeft}px`; };
    window.addEventListener('load', () => updateIndicator(tabs.gen));
    window.addEventListener('resize', () => { updateIndicator(!sections.scan.classList.contains('hide') ? tabs.scan : tabs.gen); });

    const switchTab = (tabName) => {
      Object.values(sections).forEach(sec => sec.classList.add('hide'));
      Object.values(tabs).forEach(tab => tab.classList.replace('text-primary', 'text-slate-500'));
      sections[tabName].classList.remove('hide');
      tabs[tabName].classList.replace('text-slate-500', 'text-primary');
      updateIndicator(tabs[tabName]);
      if (tabName !== 'scan') stopScanner();
    };

    tabs.gen.addEventListener('click', () => switchTab('gen'));
    tabs.scan.addEventListener('click', () => switchTab('scan'));

    // ================= View Toggle Logic (Grid/Scroll) =================
    let isGridView = true; // Grid is default now!
    const typeButtonsContainer = document.getElementById('type-buttons');
    const toggleViewBtn = document.getElementById('toggle-view-btn');
    const viewIcon = document.getElementById('view-icon');
    const viewText = document.getElementById('view-text');
    const scrollHint = document.getElementById('scroll-hint');
    const gridFade = document.getElementById('grid-fade');

    toggleViewBtn.addEventListener('click', () => {
      isGridView = !isGridView;
      if (isGridView) {
        typeButtonsContainer.classList.replace('view-scroll', 'view-grid');
        typeButtonsContainer.classList.remove('no-scrollbar');
        viewIcon.setAttribute('data-lucide', 'list');
        viewText.textContent = 'Scroll';
        scrollHint.classList.add('hide');
        gridFade.classList.remove('hide');
      } else {
        typeButtonsContainer.classList.replace('view-grid', 'view-scroll');
        typeButtonsContainer.classList.add('no-scrollbar');
        viewIcon.setAttribute('data-lucide', 'layout-grid');
        viewText.textContent = 'Grid';
        scrollHint.classList.remove('hide');
        gridFade.classList.add('hide');
      }
      lucide.createIcons();
    });


    // ================= Generator Logic =================
    const PREVIEW_SIZE = 220; 
    const qrOptions = { width: PREVIEW_SIZE, height: PREVIEW_SIZE, data: "https://qrmaster.com", margin: 5, imageOptions: { hideBackgroundDots: true, imageSize: 0.4, margin: 5 }, dotsOptions: { color: "#0f172a", type: "rounded" }, backgroundOptions: { color: "#ffffff" }, cornersSquareOptions: { color: "#0f172a", type: "extra-rounded" }, cornersDotOptions: { color: "#0f172a", type: "dot" } };
    const qrCode = new QRCodeStyling(qrOptions);
    qrCode.append(document.getElementById("qr-preview-wrapper"));

    const inputClass = "w-full px-3 py-2.5 sm:px-4 sm:py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-800 text-xs sm:text-sm hover:border-slate-300 focus:bg-white focus:border-primary focus:ring-[3px] focus:ring-indigo-100 outline-none transition-all placeholder:text-slate-400 font-medium";

    const inputTemplates = {
      url: `<input type="url" id="val-url" placeholder="Website URL" class="${inputClass}" maxlength="2048">`,
      text: `<textarea id="val-text" placeholder="Enter your text..." class="${inputClass}" rows="3" maxlength="500"></textarea>`,
      email: `<input type="email" id="val-email" placeholder="Email Address" class="${inputClass}" maxlength="255"><input type="text" id="val-sub" placeholder="Subject" class="${inputClass}" maxlength="100"><textarea id="val-body" placeholder="Message" class="${inputClass}" rows="2" maxlength="500"></textarea>`,
      sms: `<input type="tel" id="val-phone" placeholder="Phone Number" class="${inputClass}" maxlength="15"><textarea id="val-sms-body" placeholder="Message" class="${inputClass}" rows="2" maxlength="160"></textarea>`,
      wifi: `<input type="text" id="val-ssid" placeholder="Network Name" class="${inputClass}" maxlength="32"><input type="password" id="val-pw" placeholder="Password" class="${inputClass}" maxlength="63"><select id="val-enc" class="${inputClass} cursor-pointer hover:bg-slate-50/50"><option value="WPA">WPA / WPA2</option><option value="WEP">WEP</option><option value="nopass">No Encryption</option></select>`,
      vcard: `<div class="grid grid-cols-2 gap-3"><input type="text" id="val-fname" placeholder="First Name" class="${inputClass}" maxlength="50"><input type="text" id="val-lname" placeholder="Last Name" class="${inputClass}" maxlength="50"></div><input type="tel" id="val-vc-phone" placeholder="Mobile" class="${inputClass}" maxlength="15"><input type="email" id="val-vc-email" placeholder="Email (Optional)" class="${inputClass}" maxlength="255"><input type="text" id="val-org" placeholder="Company" class="${inputClass}" maxlength="100">`,
      phone: `<input type="tel" id="val-call" placeholder="Phone Number" class="${inputClass}" maxlength="15">`,
      whatsapp: `<input type="tel" id="val-wa-phone" placeholder="WhatsApp Number" class="${inputClass}" maxlength="15"><textarea id="val-wa-msg" placeholder="Message (Optional)" class="${inputClass}" rows="2"></textarea>`,
      upi: `<input type="text" id="val-upi-id" placeholder="UPI ID (e.g. name@bank)" class="${inputClass}"><input type="text" id="val-upi-name" placeholder="Payee Name" class="${inputClass}"><input type="number" id="val-upi-amt" placeholder="Amount (Optional)" class="${inputClass}">`,
      map: `<input type="text" id="val-map" placeholder="Location Name or Maps Link" class="${inputClass}">`,
      youtube: `<input type="url" id="val-yt" placeholder="YouTube URL" class="${inputClass}">`,
      instagram: `<input type="text" id="val-ig" placeholder="Instagram Username" class="${inputClass}">`,
      facebook: `<input type="url" id="val-fb" placeholder="Facebook URL" class="${inputClass}">`,
      linkedin: `<input type="url" id="val-li" placeholder="LinkedIn URL" class="${inputClass}">`,
      telegram: `<input type="text" id="val-tg" placeholder="Telegram Username" class="${inputClass}">`,
      app: `<input type="url" id="val-app" placeholder="App Store / Play Store Link" class="${inputClass}">`
    };

    let currentType = 'url';
    const dynamicInputs = document.getElementById('dynamic-inputs');
    const errorMsgBox = document.getElementById('input-error-msg');
    const errorText = document.getElementById('error-msg-text');
    const dlBtn = document.getElementById('main-download-btn');
    const qrWrapper = document.getElementById('qr-preview-wrapper');
    const indicatorDot = document.getElementById('preview-indicator');
    
    // Classes for Button State Changes
    const inactiveClasses = "type-btn bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 p-2.5 rounded-xl text-[10px] sm:text-xs font-medium transition-all flex flex-col items-center justify-center gap-2";
    const activeClasses = "type-btn active bg-primary text-white shadow-md shadow-primary/20 p-2.5 rounded-xl text-[10px] sm:text-xs font-semibold transition-all flex flex-col items-center justify-center gap-2 border border-transparent";

    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const targetBtn = e.target.closest('.type-btn');
        document.querySelectorAll('.type-btn').forEach(b => b.className = inactiveClasses);
        targetBtn.className = activeClasses;
        currentType = targetBtn.dataset.type;
        dynamicInputs.innerHTML = inputTemplates[currentType];
        lucide.createIcons();
        attachInputListeners();
        validateAndUpdateQR();
      });
    });

    dynamicInputs.innerHTML = inputTemplates['url'];
    lucide.createIcons();

    const validateInputs = () => {
      const getVal = (id) => document.getElementById(id)?.value.trim() || '';
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      const urlRegex = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/i;
      const phoneRegex = /^\+?[0-9\s\-]{7,15}$/;
      const upiRegex = /^[a-zA-Z0-9.\-_]{2,256}@[a-zA-Z]{2,64}$/;

      switch(currentType) {
        case 'url': return (!getVal('val-url')) ? {valid:false, msg:'Please enter a URL.'} : (!urlRegex.test(getVal('val-url'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'text': return getVal('val-text') ? {valid:true} : {valid:false, msg:'Please enter some text.'};
        case 'email': return (!getVal('val-email')) ? {valid:false, msg:'Please enter email.'} : (!emailRegex.test(getVal('val-email'))) ? {valid:false, msg:'Invalid email.'} : {valid:true};
        case 'sms': return (!getVal('val-phone')) ? {valid:false, msg:'Please enter phone number.'} : (!phoneRegex.test(getVal('val-phone'))) ? {valid:false, msg:'Invalid phone.'} : {valid:true};
        case 'wifi': return getVal('val-ssid') ? {valid:true} : {valid:false, msg:'Please enter Network Name.'};
        case 'vcard': 
          if (!getVal('val-fname') && !getVal('val-vc-phone')) return {valid:false, msg:'First Name or Phone required.'};
          if (getVal('val-vc-phone') && !phoneRegex.test(getVal('val-vc-phone'))) return {valid:false, msg:'Invalid phone.'};
          if (getVal('val-vc-email') && !emailRegex.test(getVal('val-vc-email'))) return {valid:false, msg:'Invalid email.'};
          return {valid:true};
        case 'phone': return (!getVal('val-call')) ? {valid:false, msg:'Please enter phone number.'} : (!phoneRegex.test(getVal('val-call'))) ? {valid:false, msg:'Invalid phone.'} : {valid:true};
        case 'whatsapp': return (!getVal('val-wa-phone')) ? {valid:false, msg:'Please enter WhatsApp number.'} : (!phoneRegex.test(getVal('val-wa-phone'))) ? {valid:false, msg:'Invalid phone.'} : {valid:true};
        case 'upi':
          if (!getVal('val-upi-id')) return {valid:false, msg:'Please enter UPI ID.'};
          if (!upiRegex.test(getVal('val-upi-id'))) return {valid:false, msg:'Invalid UPI ID (e.g. name@bank).'};
          if (!getVal('val-upi-name')) return {valid:false, msg:'Please enter Payee Name.'};
          return {valid:true};
        case 'map': return (!getVal('val-map')) ? {valid:false, msg:'Please enter Map Link or Location Name.'} : {valid:true};
        case 'youtube': return (!getVal('val-yt')) ? {valid:false, msg:'Please enter YouTube URL.'} : (!urlRegex.test(getVal('val-yt'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'facebook': return (!getVal('val-fb')) ? {valid:false, msg:'Please enter Facebook URL.'} : (!urlRegex.test(getVal('val-fb'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'linkedin': return (!getVal('val-li')) ? {valid:false, msg:'Please enter LinkedIn URL.'} : (!urlRegex.test(getVal('val-li'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'app': return (!getVal('val-app')) ? {valid:false, msg:'Please enter App Link.'} : (!urlRegex.test(getVal('val-app'))) ? {valid:false, msg:'Invalid URL.'} : {valid:true};
        case 'instagram': return (!getVal('val-ig')) ? {valid:false, msg:'Please enter Instagram username.'} : (getVal('val-ig').includes(' ')) ? {valid:false, msg:'No spaces allowed.'} : {valid:true};
        case 'telegram': return (!getVal('val-tg')) ? {valid:false, msg:'Please enter Telegram username.'} : (getVal('val-tg').includes(' ')) ? {valid:false, msg:'No spaces allowed.'} : {valid:true};
      }
    };

    const getFormattedData = () => {
      const getVal = (id) => document.getElementById(id)?.value.trim() || '';
      switch(currentType) {
        case 'url': return (/^https?:\/\//i.test(getVal('val-url'))) ? getVal('val-url') : 'https://' + getVal('val-url');
        case 'text': return getVal('val-text');
        case 'email': return `mailto:${getVal('val-email')}?subject=${encodeURIComponent(getVal('val-sub'))}&body=${encodeURIComponent(getVal('val-body'))}`;
        case 'sms': return `smsto:${getVal('val-phone')}:${getVal('val-sms-body')}`;
        case 'wifi': return `WIFI:T:${getVal('val-enc')};S:${getVal('val-ssid')};P:${getVal('val-pw')};;`;
        case 'vcard': return `BEGIN:VCARD\nVERSION:3.0\nN:${getVal('val-lname')};${getVal('val-fname')}\nFN:${getVal('val-fname')} ${getVal('val-lname')}\nTEL;TYPE=CELL:${getVal('val-vc-phone')}\nEMAIL:${getVal('val-vc-email')}\nORG:${getVal('val-org')}\nEND:VCARD`;
        case 'phone': return `tel:${getVal('val-call')}`;
        case 'whatsapp': return `https://wa.me/${getVal('val-wa-phone').replace(/\+/g,'')}?text=${encodeURIComponent(getVal('val-wa-msg'))}`;
        case 'upi': return `upi://pay?pa=${getVal('val-upi-id')}&pn=${encodeURIComponent(getVal('val-upi-name'))}${getVal('val-upi-amt') ? '&am='+getVal('val-upi-amt') : ''}&cu=INR`;
        case 'map': 
          let mapVal = getVal('val-map');
          return /^https?:\/\//i.test(mapVal) ? mapVal : 'https://maps.google.com/?q=' + encodeURIComponent(mapVal);
        case 'youtube': return (/^https?:\/\//i.test(getVal('val-yt'))) ? getVal('val-yt') : 'https://' + getVal('val-yt');
        case 'facebook': return (/^https?:\/\//i.test(getVal('val-fb'))) ? getVal('val-fb') : 'https://' + getVal('val-fb');
        case 'linkedin': return (/^https?:\/\//i.test(getVal('val-li'))) ? getVal('val-li') : 'https://' + getVal('val-li');
        case 'app': return (/^https?:\/\//i.test(getVal('val-app'))) ? getVal('val-app') : 'https://' + getVal('val-app');
        case 'instagram': return `https://instagram.com/${getVal('val-ig').replace('@', '')}`;
        case 'telegram': return `https://t.me/${getVal('val-tg').replace('@', '')}`;
      }
    };

    const validateAndUpdateQR = () => {
      const validation = validateInputs();
      if(!validation.valid) {
        errorText.textContent = validation.msg; errorMsgBox.classList.remove('hide'); 
        qrWrapper.classList.add('opacity-30', 'grayscale', 'blur-[2px]'); 
        dlBtn.classList.add('opacity-50', 'cursor-not-allowed'); 
        indicatorDot.classList.replace('bg-emerald-400', 'bg-slate-300'); indicatorDot.classList.remove('animate-pulse');
      } else {
        errorMsgBox.classList.add('hide'); 
        qrWrapper.classList.remove('opacity-30', 'grayscale', 'blur-[2px]'); 
        dlBtn.classList.remove('opacity-50', 'cursor-not-allowed'); 
        indicatorDot.classList.replace('bg-slate-300', 'bg-emerald-400'); indicatorDot.classList.add('animate-pulse');
        qrOptions.data = getFormattedData(); qrCode.update(qrOptions);
      }
    };

    const attachInputListeners = () => { 
      dynamicInputs.querySelectorAll('input, textarea, select').forEach(el => {
        if(el.type === 'tel') { el.addEventListener('keypress', (e) => { if(!/[0-9+\- ]/.test(e.key)) e.preventDefault(); }); }
        el.addEventListener('input', validateAndUpdateQR);
      }); 
    };
    attachInputListeners(); validateAndUpdateQR();

    // Design Listeners
    document.getElementById('color-dark').addEventListener('input', (e) => { qrOptions.dotsOptions.color = e.target.value; qrOptions.cornersSquareOptions.color = e.target.value; qrOptions.cornersDotOptions.color = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('color-light').addEventListener('input', (e) => { qrOptions.backgroundOptions.color = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('dots-style').addEventListener('change', (e) => { qrOptions.dotsOptions.type = e.target.value; qrCode.update(qrOptions); });
    document.getElementById('corners-style').addEventListener('change', (e) => { qrOptions.cornersSquareOptions.type = e.target.value; qrOptions.cornersDotOptions.type = e.target.value === 'extra-rounded' ? 'dot' : 'square'; qrCode.update(qrOptions); });

    const logoInput = document.getElementById('logo-input'), clearLogoBtn = document.getElementById('clear-logo');
    logoInput.addEventListener('change', function(e) { if(e.target.files[0]) { const reader = new FileReader(); reader.onload = (ev) => { qrOptions.image = ev.target.result; qrCode.update(qrOptions); clearLogoBtn.classList.remove('hide'); }; reader.readAsDataURL(e.target.files[0]); }});
    clearLogoBtn.addEventListener('click', () => { logoInput.value = ''; qrOptions.image = null; qrCode.update(qrOptions); clearLogoBtn.classList.add('hide'); });

    // Format Setup
    let selectedFormat = 'png';
    const btnPng = document.getElementById('btn-format-png'), btnSvg = document.getElementById('btn-format-svg');
    const updateFormatUI = (format) => {
      selectedFormat = format;
      if(format === 'png') { btnPng.className = "format-btn active flex-1 py-2.5 rounded-lg bg-white text-primary font-bold shadow-sm border border-slate-200 text-sm flex justify-center items-center gap-1.5"; btnSvg.className = "format-btn flex-1 py-2.5 rounded-lg bg-transparent text-slate-500 font-semibold hover:text-slate-700 text-sm flex justify-center items-center gap-1.5"; }
      else { btnSvg.className = "format-btn active flex-1 py-2.5 rounded-lg bg-white text-primary font-bold shadow-sm border border-slate-200 text-sm flex justify-center items-center gap-1.5"; btnPng.className = "format-btn flex-1 py-2.5 rounded-lg bg-transparent text-slate-500 font-semibold hover:text-slate-700 text-sm flex justify-center items-center gap-1.5"; }
    };
    btnPng.addEventListener('click', () => updateFormatUI('png')); btnSvg.addEventListener('click', () => updateFormatUI('svg'));

    // Download Button
    dlBtn.addEventListener('click', () => {
      if(!validateInputs().valid) return;
      const sizeSelect = document.getElementById('qr-size');
      let downloadSize = parseInt(sizeSelect.value) || 512;
      
      qrCode.update({ width: downloadSize, height: downloadSize });
      qrCode.download({ extension: selectedFormat, name: `QR_Master_${downloadSize}px` }).then(() => { 
        qrCode.update({ width: PREVIEW_SIZE, height: PREVIEW_SIZE }); 
      });
    });

    // ================= SMART SCANNER =================
    let html5QrCode, messageTimeout;
    const startCamBtn = document.getElementById('scan-camera-btn'), stopCamBtn = document.getElementById('stop-camera-btn'), camPlaceholder = document.getElementById('camera-placeholder'), resultContainer = document.getElementById('scan-result-container'), rawDataInput = document.getElementById('raw-scan-data'), richContentBox = document.getElementById('scan-rich-content'), scanTypeLabel = document.getElementById('scan-type-label');
    
    const showUIMessage = (text, isError = true) => {
      const msgBox = document.getElementById('ui-message'); document.getElementById('ui-message-text').textContent = text;
      msgBox.className = `w-full mb-5 px-5 py-4 rounded-xl text-sm font-semibold flex items-center gap-3 shadow-sm transform scale-100 border ${isError ? 'bg-rose-50 text-rose-600 border-rose-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`;
      clearTimeout(messageTimeout); messageTimeout = setTimeout(() => msgBox.classList.add('hide'), 4000);
    };

    window.copyWifiPassword = (pwd) => {
      navigator.clipboard.writeText(pwd).then(() => { alert("WiFi Password Copied!"); });
    };

    const handleScanSuccess = (decodedText) => {
      stopScanner(); rawDataInput.value = decodedText; resultContainer.classList.remove('hide');
      let resultType = 'Text Scanned', icon = 'align-left', resultHTML = '';

      if (decodedText.toLowerCase().startsWith('upi://pay')) {
        resultType = 'UPI Payment Code'; icon = 'indian-rupee';
        let payeeName = 'Unknown Merchant', upiId = 'Unknown ID', amount = '';
        try {
          const upiUrl = new URL(decodedText);
          payeeName = upiUrl.searchParams.get('pn') || 'Unknown Merchant'; upiId = upiUrl.searchParams.get('pa') || 'Unknown ID';
          amount = upiUrl.searchParams.get('am') ? `₹${upiUrl.searchParams.get('am')}` : '';
        } catch(e) {
          const pnMatch = decodedText.match(/[?&]pn=([^&]+)/); const paMatch = decodedText.match(/[?&]pa=([^&]+)/);
          if(pnMatch) payeeName = decodeURIComponent(pnMatch[1]); if(paMatch) upiId = decodeURIComponent(paMatch[1]);
        }
        resultHTML = `<div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100 flex flex-col items-center text-center gap-2"><p class="text-slate-500 font-semibold text-sm">Paying To:</p><p class="font-black text-lg text-slate-800">${payeeName}</p><p class="text-xs text-slate-500 font-medium break-all">${upiId}</p>${amount ? `<p class="font-bold text-xl text-emerald-600 mt-2">${amount}</p>` : ''}<a href="${decodedText}" class="w-full px-5 py-3.5 bg-[#1ea271] text-white text-sm font-bold rounded-xl hover:bg-[#16855b] transition-colors shadow-sm flex justify-center items-center gap-2 mt-3"><i data-lucide="smartphone-nfc" class="w-4 h-4"></i> Pay with UPI App</a></div>`;
      }
      else if (decodedText.match(/wa\.me/i) || decodedText.match(/^whatsapp:/i)) {
        resultType = 'WhatsApp Action'; icon = 'message-circle';
        resultHTML = `<div class="p-4 bg-[#25D366]/10 border border-[#25D366]/30 rounded-xl flex flex-col items-center text-center gap-3"><i data-lucide="message-circle" class="w-8 h-8 text-[#25D366]"></i><span class="text-sm font-bold text-slate-700 break-all">${decodedText}</span><a href="${decodedText}" target="_blank" class="w-full px-5 py-3 bg-[#25D366] text-white text-sm font-bold rounded-xl hover:bg-[#128C7E] transition-colors shadow-sm flex justify-center items-center gap-2 mt-1"><i data-lucide="external-link" class="w-4 h-4"></i> Chat on WhatsApp</a></div>`;
      }
      else if (decodedText.match(/^geo:/i) || decodedText.match(/maps\.google\.com/i) || decodedText.match(/goo\.gl\/maps/i)) {
        resultType = 'Location & Map'; icon = 'map-pin';
        resultHTML = `<div class="p-4 bg-blue-50 border border-blue-100 rounded-xl flex flex-col items-center text-center gap-3"><i data-lucide="map-pin" class="w-8 h-8 text-blue-500"></i><span class="text-sm font-semibold text-slate-700 break-all">${decodedText}</span><a href="${decodedText}" target="_blank" class="w-full px-5 py-3 bg-blue-500 text-white text-sm font-bold rounded-xl hover:bg-blue-600 transition-colors shadow-sm flex justify-center items-center gap-2 mt-1"><i data-lucide="navigation" class="w-4 h-4"></i> Open in Maps</a></div>`;
      }
      else if (decodedText.match(/youtube\.com/i) || decodedText.match(/youtu\.be/i)) {
        resultType = 'YouTube Link'; icon = 'youtube'; resultHTML = buildAppUI(decodedText, 'bg-red-50', 'border-red-100', 'text-red-600', 'bg-red-600', 'hover:bg-red-700', 'youtube', 'Open YouTube');
      } else if (decodedText.match(/instagram\.com/i)) {
        resultType = 'Instagram Profile'; icon = 'instagram'; resultHTML = buildAppUI(decodedText, 'bg-pink-50', 'border-pink-100', 'text-pink-600', 'bg-gradient-to-tr from-yellow-400 via-pink-500 to-purple-600', 'hover:opacity-90', 'instagram', 'Open Instagram');
      } else if (decodedText.match(/facebook\.com/i) || decodedText.match(/fb\.me/i)) {
        resultType = 'Facebook Link'; icon = 'facebook'; resultHTML = buildAppUI(decodedText, 'bg-blue-50', 'border-blue-100', 'text-blue-600', 'bg-[#1877F2]', 'hover:bg-[#166fe5]', 'facebook', 'Open Facebook');
      } else if (decodedText.match(/linkedin\.com/i)) {
        resultType = 'LinkedIn Profile'; icon = 'linkedin'; resultHTML = buildAppUI(decodedText, 'bg-blue-50', 'border-blue-100', 'text-blue-700', 'bg-[#0A66C2]', 'hover:bg-[#084e96]', 'linkedin', 'Open LinkedIn');
      } else if (decodedText.match(/t\.me/i) || decodedText.match(/telegram\.me/i)) {
        resultType = 'Telegram Link'; icon = 'send'; resultHTML = buildAppUI(decodedText, 'bg-cyan-50', 'border-cyan-100', 'text-cyan-600', 'bg-[#229ED9]', 'hover:bg-[#1c88b9]', 'send', 'Open Telegram');
      } else if (decodedText.match(/play\.google\.com/i) || decodedText.match(/apps\.apple\.com/i)) {
        resultType = 'App Store Link'; icon = 'layout-grid'; resultHTML = buildAppUI(decodedText, 'bg-slate-100', 'border-slate-200', 'text-slate-800', 'bg-slate-800', 'hover:bg-slate-900', 'download', 'Download App');
      }
      else if (decodedText.startsWith('WIFI:')) {
        resultType = 'WiFi Network'; icon = 'wifi';
        let ssid = decodedText.match(/S:(.*?);/)?.[1] || 'Unknown'; let pwd = decodedText.match(/P:(.*?);/)?.[1] || '';
        resultHTML = `<div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-100"><span class="font-bold text-slate-500 uppercase text-xs">Network Name</span> <span class="font-bold text-slate-900">${ssid}</span></div><div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-xl border border-slate-100 mt-2"><span class="font-bold text-slate-500 uppercase text-xs">Password</span> <span class="font-bold text-slate-900">${pwd ? pwd : 'No Password'}</span></div>${pwd ? `<button onclick="copyWifiPassword('${pwd.replace(/'/g, "\\'")}')" class="w-full mt-3 px-4 py-3 bg-slate-900 text-white text-sm font-bold rounded-xl hover:bg-slate-800 transition-colors shadow-sm flex justify-center items-center gap-2"><i data-lucide="copy" class="w-4 h-4"></i> Copy Password</button>` : ''}`;
      } 
      else if (decodedText.startsWith('BEGIN:VCARD')) {
        resultType = 'Contact Details'; icon = 'contact';
        let name = decodedText.match(/FN:(.*?)\n/)?.[1] || 'Unknown'; let phone = decodedText.match(/TEL.*?:(.*?)\n/)?.[1] || '';
        resultHTML = `<div class="p-4 bg-slate-50 rounded-xl border border-slate-100 flex flex-col gap-2"><p class="font-black text-lg text-slate-900">${name}</p>${phone ? `<p class="font-semibold text-slate-600 flex items-center gap-2"><i data-lucide="phone" class="w-4 h-4 text-slate-400"></i> ${phone}</p>` : ''}</div>${phone ? `<a href="tel:${phone.replace(/\s+/g,'')}" class="mt-3 w-full px-4 py-3 bg-primary text-white text-sm font-bold rounded-xl hover:bg-indigo-700 flex justify-center items-center gap-2 shadow-sm"><i data-lucide="phone-call" class="w-4 h-4"></i> Call Now</a>` : ''}`;
      } 
      else if (/^https?:\/\//i.test(decodedText)) {
        resultType = 'Website URL'; icon = 'link';
        resultHTML = `<div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100 flex flex-col items-center text-center gap-3"><span class="text-sm font-semibold text-slate-700 break-all">${decodedText}</span><a href="${decodedText}" target="_blank" class="w-full px-5 py-3 bg-primary text-white text-sm font-bold rounded-xl hover:bg-indigo-700 transition-colors shadow-sm flex justify-center items-center gap-2 mt-1"><i data-lucide="external-link" class="w-4 h-4"></i> Open Website</a></div>`;
      } 
      else if (decodedText.toLowerCase().startsWith('smsto:') || decodedText.toLowerCase().startsWith('tel:')) {
        resultType = 'Phone Action'; icon = 'phone';
        resultHTML = `<div class="p-4 bg-slate-50 rounded-xl border border-slate-100 font-bold text-slate-700 break-all text-center">${decodedText.replace(/^(smsto:|tel:)/i, '')}</div><a href="${decodedText}" class="w-full mt-3 px-4 py-3 bg-emerald-500 text-white text-sm font-bold rounded-xl hover:bg-emerald-600 transition-colors flex justify-center items-center gap-2 shadow-sm"><i data-lucide="smartphone" class="w-4 h-4"></i> Take Action</a>`;
      }
      else {
        resultHTML = `<div class="p-4 bg-slate-50 rounded-xl border border-slate-100 font-medium text-slate-700 break-all whitespace-pre-wrap">${decodedText}</div>`;
      }

      scanTypeLabel.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i> ${resultType}`;
      richContentBox.innerHTML = resultHTML;
      lucide.createIcons();
      setTimeout(() => { resultContainer.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 150);
    };

    const buildAppUI = (url, bgLight, borderLight, textDark, btnColor, btnHover, lucideIcon, btnText) => {
      return `<div class="p-4 ${bgLight} border ${borderLight} rounded-xl flex flex-col items-center text-center gap-3"><i data-lucide="${lucideIcon}" class="w-8 h-8 ${textDark}"></i><span class="text-sm font-bold text-slate-700 break-all">${url}</span><a href="${url}" target="_blank" class="w-full px-5 py-3 ${btnColor} text-white text-sm font-bold rounded-xl ${btnHover} transition-all shadow-sm flex justify-center items-center gap-2 mt-1"><i data-lucide="external-link" class="w-4 h-4"></i> ${btnText}</a></div>`;
    };

    const startScanner = () => {
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      resultContainer.classList.add('hide'); camPlaceholder.style.display = 'none';
      startCamBtn.classList.add('hide'); stopCamBtn.classList.remove('hide');
      const config = { fps: 30, qrbox: { width: 280, height: 280 }, aspectRatio: 1.0, rememberLastUsedCamera: true };
      html5QrCode.start( { facingMode: "environment" }, config, 
        (decodedText) => { handleScanSuccess(decodedText); },
        (errorMessage) => { }
      ).catch(err => { showUIMessage("Camera permission denied.", true); stopScanner(); });
    };
    
    const stopScanner = () => {
      if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => { startCamBtn.classList.remove('hide'); stopCamBtn.classList.add('hide'); camPlaceholder.style.display = 'flex'; }).catch(console.error);
      } else {
        startCamBtn.classList.remove('hide'); stopCamBtn.classList.add('hide'); camPlaceholder.style.display = 'flex';
      }
    };

    startCamBtn.addEventListener('click', startScanner); stopCamBtn.addEventListener('click', stopScanner);

    document.getElementById('copy-result-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(rawDataInput.value).then(() => {
        const icon = document.querySelector('#copy-result-btn i');
        icon.setAttribute('data-lucide', 'check'); icon.classList.add('text-primary'); lucide.createIcons();
        setTimeout(() => { icon.setAttribute('data-lucide', 'copy'); icon.classList.remove('text-primary'); lucide.createIcons(); }, 2000);
      });
    });
  </script>
</body>
</html>
